/* ─────────────────────────── DEEP LEARNING ─────────────────────────── */
{
  id: "dl", name: "Deep Learning", short: "DL",
  tagline: "stacked layers, learned representations",
  desc: "Neural networks trained by backpropagation: activations, losses, optimisers, CNNs, Transformers, and generative models from VAEs to diffusion and LLMs.",
  heroTitle: ["Deep", "Learning"],
  heroSub: "Neural networks learn their own features from raw data. Start with the building blocks (neurons, activations, losses, optimisers) and work up to CNNs, Transformers, diffusion models and LLMs.",
  lab: "act",
  sections: [
  { id: "nn", name: "Neural Network Basics", lead: "Layers of learned linear maps and non-linearities.", items: [
    { t: "Perceptron & Neuron", tags: ["basics"],
      d: "A neuron takes a weighted sum of its inputs plus a bias and applies an activation. A single perceptron can only separate linearly separable data, so it can't learn XOR.",
      f: "a = φ(wᵀx + b)" },
    { t: "Multi-Layer Perceptron", tags: ["architecture"],
      d: "Stacked fully connected layers with non-linear activations. By the universal approximation theorem, one wide enough hidden layer can approximate any continuous function.",
      f: "h₁ = φ(W₁x + b₁)\nŷ  = W₂h₁ + b₂",
      code: `import torch.nn as nn
model = nn.Sequential(
    nn.Linear(784, 256), nn.ReLU(), nn.Dropout(0.2),
    nn.Linear(256, 128), nn.ReLU(),
    nn.Linear(128, 10))` },
    { t: "Tensors & Autograd", tags: ["framework"],
      d: "Tensors are n-dimensional arrays that can run on a GPU. Autograd records each operation in a graph and computes the gradients for you.",
      code: `import torch
x = torch.tensor(3.0, requires_grad=True)
y = x**2 + 2*x
y.backward()
x.grad  # tensor(8.)  → dy/dx = 2x + 2` },
    { t: "Forward & Backpropagation", tags: ["training"],
      d: "The forward pass computes the loss. The backward pass applies the chain rule layer by layer to get ∂L/∂W for every weight, reusing values stored during the forward pass.",
      f: "δˡ = (Wˡ⁺¹ᵀ δˡ⁺¹) ⊙ φ'(zˡ)\n∂L/∂Wˡ = δˡ (aˡ⁻¹)ᵀ" },
    { t: "The Training Loop", tags: ["pytorch"],
      d: "Each step: forward pass, compute the loss, zero the gradients, backward pass, optimiser step. Repeat for every batch in every epoch.",
      code: `opt = torch.optim.AdamW(model.parameters(), lr=1e-3)
loss_fn = nn.CrossEntropyLoss()
for epoch in range(epochs):
    model.train()
    for xb, yb in train_loader:
        loss = loss_fn(model(xb), yb)
        opt.zero_grad()
        loss.backward()
        opt.step()` },
    { t: "Weight Initialisation", tags: ["training"],
      d: "Keeps the variance of activations stable across layers. Use Xavier for tanh or sigmoid and He for ReLU. All-zero initialisation never breaks symmetry, so every neuron learns the same thing.",
      f: "Xavier: Var(W) = 2/(n_in + n_out)\nHe:     Var(W) = 2/n_in" },
    { t: "Vanishing & Exploding Gradients", tags: ["pitfall"],
      d: "Repeated multiplication through many layers shrinks gradients toward zero or blows them up. Fixes: ReLU-family activations, good initialisation, normalisation, residual connections and gradient clipping." },
    { t: "BatchNorm & LayerNorm", tags: ["normalisation"],
      d: "BatchNorm normalises each feature across the batch (common in CNNs). LayerNorm normalises across features within one sample (used in Transformers). RMSNorm is a cheaper variant used in LLMs.",
      f: "x̂ = (x − μ) / √(σ² + ε),   y = γx̂ + β" },
    { t: "Residual Connections", tags: ["architecture"],
      d: "y = x + F(x). The skip path lets gradients flow straight through, which makes networks with 100+ layers trainable." }
  ]},
  { id: "activations", name: "Activation Functions", lead: "The non-linearities that give networks their expressive power. Plot them in the lab above.", items: [
    { t: "Sigmoid", tags: ["classic"],
      d: "Squashes its input to (0, 1), which suits binary outputs and gates. It saturates and isn't zero-centred.",
      f: "σ(x) = 1 / (1 + e⁻ˣ)\nσ'(x) = σ(x)(1 − σ(x))   (max 0.25)",
      pros: ["Probabilistic output"], cons: ["Vanishing gradients", "Not zero-centred"],
      code: `def sigmoid(x): return 1 / (1 + np.exp(-x))` },
    { t: "Tanh", tags: ["classic"],
      d: "Squashes to (−1, 1) and is zero-centred. It still saturates, and it's common inside RNN and LSTM cells.",
      f: "tanh(x) = (eˣ − e⁻ˣ)/(eˣ + e⁻ˣ)\ntanh'(x) = 1 − tanh²(x)" },
    { t: "ReLU", tags: ["default"],
      d: "Cheap, produces sparse activations and doesn't saturate for x > 0. It's the default for hidden layers, but neurons that only ever get negative inputs 'die' and stop learning.",
      f: "ReLU(x) = max(0, x)\nReLU'(x) = 1 if x > 0 else 0",
      pros: ["Fast", "No saturation for x > 0"], cons: ["Dying ReLU"],
      code: `def relu(x): return np.maximum(0, x)` },
    { t: "Leaky ReLU / PReLU", tags: ["ReLU family"],
      d: "A small slope for x < 0 keeps neurons from dying. PReLU learns the slope α.",
      f: "f(x) = x if x > 0 else αx   (α ≈ 0.01)" },
    { t: "ELU / SELU", tags: ["ReLU family"],
      d: "A smooth negative region pushes mean activations toward 0. SELU keeps activations normalised on its own.",
      f: "ELU(x) = x if x > 0 else α(eˣ − 1)" },
    { t: "GELU", tags: ["transformers"],
      d: "A smooth ReLU that weights x by the Gaussian CDF. It's the default in BERT and GPT.",
      f: "GELU(x) = x · Φ(x) ≈ 0.5x(1 + tanh[√(2/π)(x + 0.044715x³)])" },
    { t: "Swish / SiLU", tags: ["modern"],
      d: "Smooth and non-monotonic. It's used in EfficientNet and in the SwiGLU layers of LLaMA.",
      f: "Swish(x) = x · σ(βx)   (SiLU: β = 1)" },
    { t: "Softmax", tags: ["output"],
      d: "Turns logits into a probability distribution. Subtract the max logit first for numerical stability.",
      f: "softmax(z)ᵢ = e^{zᵢ} / Σⱼ e^{zⱼ}",
      code: `def softmax(z):
    e = np.exp(z - z.max(axis=-1, keepdims=True))
    return e / e.sum(axis=-1, keepdims=True)` },
    { t: "Which one to use?", tags: ["cheat sheet"],
      d: "Hidden layers: ReLU, or GELU/SiLU in Transformers. Outputs: linear for regression, sigmoid for binary, softmax for multi-class, one sigmoid per label for multi-label, and tanh for bounded outputs." }
  ]},
  { id: "losses", name: "Loss Functions", lead: "What the network actually optimises.", items: [
    { t: "MSE (L2)", tags: ["regression"], d: "Penalises errors quadratically. It's the maximum-likelihood loss under Gaussian noise and is sensitive to outliers.", f: "L = (1/n) Σ (y − ŷ)²" },
    { t: "MAE (L1)", tags: ["regression"], d: "Robust to outliers; minimising it estimates the median.", f: "L = (1/n) Σ |y − ŷ|" },
    { t: "Huber / Smooth L1", tags: ["robust"], d: "Quadratic for small errors and linear for large ones.", f: "L = ½e²           if |e| ≤ δ\n    δ(|e| − ½δ)   otherwise" },
    { t: "Binary Cross-Entropy", tags: ["classification"], d: "The loss for sigmoid outputs. In PyTorch, use BCEWithLogitsLoss for numerical stability.", f: "L = −[y log p + (1 − y) log(1 − p)]" },
    { t: "Categorical Cross-Entropy", tags: ["classification"], d: "The loss for softmax outputs. Label smoothing reduces overconfidence.", f: "L = −Σₖ yₖ log pₖ",
      code: `nn.CrossEntropyLoss(label_smoothing=0.1)  # takes raw logits` },
    { t: "Focal Loss", tags: ["imbalance"], d: "Down-weights easy examples so training focuses on hard ones. It's used in object detection.", f: "FL = −α(1 − p_t)^γ log(p_t)" },
    { t: "Contrastive / InfoNCE", tags: ["representation"], d: "Pulls matching pairs together and pushes others apart in embedding space. It's the loss behind SimCLR and CLIP.", f: "L = −log( e^{sim(a,p)/τ} / Σⱼ e^{sim(a,j)/τ} )" },
    { t: "KL Divergence", tags: ["distributions"], d: "Measures how far one distribution is from another. Used in VAEs, knowledge distillation and the KL penalty in RLHF.", f: "KL(p‖q) = Σ p log(p/q)" }
  ]},
  { id: "optim", name: "Optimisers", lead: "How the weights get updated.", items: [
    { t: "Gradient Descent / SGD", tags: ["basics"], d: "Take a step against the gradient. Mini-batch SGD, which estimates the gradient from a small batch, is the standard.", f: "θ ← θ − η ∇_θ L(θ)" },
    { t: "Momentum & Nesterov", tags: ["SGD+"], d: "Keeps a running velocity so steps build up in consistent directions and oscillations cancel out.", f: "v ← βv + ∇L\nθ ← θ − ηv" },
    { t: "RMSProp", tags: ["adaptive"], d: "Gives each parameter its own learning rate, scaled by a moving average of its squared gradients.", f: "s ← ρs + (1 − ρ)g²\nθ ← θ − η g / (√s + ε)" },
    { t: "Adam / AdamW", tags: ["default"], d: "Momentum plus RMSProp, with bias correction. AdamW decouples weight decay from the update and is the standard for Transformers.",
      f: "m ← β₁m + (1−β₁)g      v ← β₂v + (1−β₂)g²\nm̂ = m/(1−β₁ᵗ)          v̂ = v/(1−β₂ᵗ)\nθ ← θ − η m̂ / (√v̂ + ε)",
      code: `torch.optim.AdamW(model.parameters(), lr=3e-4, weight_decay=0.01)` },
    { t: "Learning-Rate Schedules", tags: ["training"], d: "Common choices are step decay, cosine annealing, one-cycle, and a linear warmup followed by decay. The learning rate is usually the most important hyperparameter to get right.",
      code: `sched = torch.optim.lr_scheduler.OneCycleLR(opt, max_lr=1e-3,
            total_steps=len(loader) * epochs)` },
    { t: "Gradient Clipping", tags: ["stability"], d: "Rescales gradients whose norm exceeds a threshold, which prevents exploding gradients.",
      code: `torch.nn.utils.clip_grad_norm_(model.parameters(), max_norm=1.0)` }
  ]},
  { id: "reg", name: "Regularisation", lead: "Getting networks to generalise rather than memorise.", items: [
    { t: "Weight Decay (L2)", tags: ["weights"], d: "Penalises large weights to keep the model smooth.", f: "L_total = L + λ‖w‖₂²" },
    { t: "Dropout", tags: ["stochastic"], d: "Randomly zeroes activations during training, which acts like training an ensemble. It's turned off at inference.", code: `nn.Dropout(p=0.3)   # model.eval() disables it` },
    { t: "Early Stopping", tags: ["training"], d: "Stop training when the validation loss stops improving, and restore the best weights." },
    { t: "Data Augmentation", tags: ["data"], d: "Images: flips, crops, colour jitter, Mixup and CutMix. Text: back-translation. Audio: SpecAugment." },
    { t: "Other Tricks", tags: ["misc"], d: "Label smoothing, stochastic depth, adding noise, and weight averaging (SWA or EMA)." }
  ]},
  { id: "arch", name: "Architectures", lead: "Networks built for images, sequences and graphs.", items: [
    { t: "Convolutional Networks (CNN)", tags: ["vision"],
      d: "Filters slide over the input, sharing weights across positions. Pooling downsamples, and each layer sees a wider receptive field. Well-known examples: LeNet, AlexNet, VGG, ResNet, EfficientNet.",
      f: "out = (W − K + 2P) / S + 1",
      code: `nn.Sequential(
    nn.Conv2d(3, 32, 3, padding=1), nn.BatchNorm2d(32), nn.ReLU(),
    nn.MaxPool2d(2),
    nn.Conv2d(32, 64, 3, padding=1), nn.ReLU(),
    nn.AdaptiveAvgPool2d(1), nn.Flatten(), nn.Linear(64, 10))` },
    { t: "RNN, LSTM & GRU", tags: ["sequences"],
      d: "Carry a hidden state from step to step. LSTMs and GRUs add gates that preserve long-range information. Transformers have largely replaced them.",
      f: "hₜ = tanh(W_h hₜ₋₁ + W_x xₜ + b)\nLSTM: cₜ = fₜ⊙cₜ₋₁ + iₜ⊙c̃ₜ" },
    { t: "Attention", tags: ["core idea"],
      d: "Each token computes a weighted mix of all values, with the weights set by how similar its query is to each key. Multi-head attention runs several of these in parallel.",
      f: "Attention(Q,K,V) = softmax(QKᵀ / √d_k) V",
      code: `def attention(Q, K, V, mask=None):
    scores = Q @ K.transpose(-2, -1) / K.size(-1) ** 0.5
    if mask is not None:
        scores = scores.masked_fill(mask == 0, float("-inf"))
    return scores.softmax(-1) @ V` },
    { t: "Transformer", tags: ["architecture"],
      d: "Blocks of self-attention followed by an MLP, with residual connections and LayerNorm, plus positional encodings such as RoPE. Variants are encoder-only (BERT), decoder-only (GPT) or encoder–decoder (T5)." },
    { t: "Vision Transformer (ViT)", tags: ["vision"],
      d: "Splits an image into 16×16 patches and treats them as tokens. It needs a lot of data or strong pretraining, and it scales very well." },
    { t: "Graph Neural Networks", tags: ["graphs"],
      d: "Each node aggregates features from its neighbours (message passing). Common variants are GCN, GraphSAGE and GAT, applied to molecules, social networks and recommendations." },
    { t: "Mixture of Experts", tags: ["scaling"],
      d: "A router sends each token to only a few expert MLPs, so the model has many parameters but low compute per token." },
    { t: "Transfer Learning", tags: ["practice"],
      d: "Start from a pretrained model. Either freeze the backbone and train a new head, or fine-tune everything with a low learning rate.",
      code: `import torchvision.models as tvm
m = tvm.resnet50(weights="IMAGENET1K_V2")
for p in m.parameters(): p.requires_grad = False
m.fc = nn.Linear(m.fc.in_features, num_classes)` }
  ]},
  { id: "gen", name: "Generative Models & LLMs", lead: "Models that create new images, text and audio.", items: [
    { t: "Autoencoders & VAEs", tags: ["latent"],
      d: "An encoder compresses the input to a latent vector z and a decoder reconstructs it. A VAE makes the latent space probabilistic so you can sample new data from it.",
      f: "VAE: L = E[log p(x|z)] − KL(q(z|x) ‖ N(0, I))" },
    { t: "GANs", tags: ["adversarial"],
      d: "A generator tries to fool a discriminator. Samples are sharp, but training is unstable and prone to mode collapse.",
      f: "min_G max_D E[log D(x)] + E[log(1 − D(G(z)))]" },
    { t: "Diffusion Models", tags: ["SOTA"],
      d: "Trained to reverse a gradual noising process step by step. They're behind Stable Diffusion and most modern image and video generation, with classifier-free guidance steering outputs toward the prompt.",
      f: "L = E‖ε − ε_θ(x_t, t)‖²" },
    { t: "Tokenisation & Embeddings", tags: ["language"],
      d: "Subword tokenisers (BPE, WordPiece) split text into tokens, and an embedding table maps each token to a dense vector. Cosine similarity measures how close two meanings are.",
      f: "cos(a, b) = a·b / (‖a‖‖b‖)" },
    { t: "Large Language Models", tags: ["LLM"],
      d: "Decoder Transformers pretrained on next-token prediction, then instruction-tuned and aligned with RLHF or DPO (see the RL track).",
      f: "P(x) = Πₜ P(xₜ | x<ₜ)",
      code: `from transformers import pipeline
gen = pipeline("text-generation", model="gpt2")
gen("Deep learning is", max_new_tokens=30)` },
    { t: "Fine-tuning: LoRA & QLoRA", tags: ["efficiency"],
      d: "Freeze the base model and train small low-rank adapters. QLoRA also quantises the base model to 4-bit so fine-tuning fits on one GPU.",
      f: "W' = W + BA,   B ∈ ℝ^{d×r}, A ∈ ℝ^{r×k},  r ≪ d" },
    { t: "RAG", tags: ["LLM apps"],
      d: "Retrieval-Augmented Generation embeds the query, retrieves the top-k chunks from a vector database, and adds them to the prompt, which grounds the answer in real sources." },
    { t: "Multimodal (CLIP & co.)", tags: ["vision + text"],
      d: "Image and text encoders trained contrastively into a shared embedding space. This enables zero-shot classification and conditioning for image generation." }
  ]},
  { id: "scale", name: "Training in Practice", lead: "Tips for training networks that actually work.", items: [
    { t: "Debugging Recipe", tags: ["practice"],
      d: "Overfit a single batch first, check the loss at initialisation (about ln K for K classes), visualise the inputs, and start from a known-good baseline before adding anything else." },
    { t: "Mixed Precision", tags: ["speed"],
      d: "Train in FP16 or BF16 with an FP32 master copy of the weights. It's roughly twice as fast and uses about half the memory.",
      code: `with torch.autocast("cuda", dtype=torch.bfloat16):
    loss = loss_fn(model(x), y)` },
    { t: "Compression", tags: ["deployment"],
      d: "Quantisation (INT8 or 4-bit), pruning and knowledge distillation, where a small student model learns from a large teacher." },
    { t: "Scaling Laws", tags: ["theory"],
      d: "Loss falls as a power law in parameters, data and compute. For a fixed compute budget, compute-optimal training (Chinchilla) balances model size against the number of tokens." }
  ]},
  { id: "toolbox", name: "Toolbox", lead: "Deep learning frameworks and tools.", items: [
    { t: "PyTorch", tags: ["framework"], d: "Pythonic with dynamic graphs; the default for research and most of industry. Lightning removes much of the training-loop boilerplate." },
    { t: "TensorFlow / Keras", tags: ["framework"], d: "Keras is a high-level API. TF has strong production and mobile tooling (TF Lite, TF Serving)." },
    { t: "JAX", tags: ["framework"], d: "NumPy-style code with autodiff, JIT compilation (jit) and automatic vectorisation (vmap). Flax and Equinox build neural networks on it." },
    { t: "Hugging Face", tags: ["ecosystem"], d: "The Transformers, Datasets, Tokenizers, PEFT and Diffusers libraries, plus a hub of pretrained models." }

/* ─────────────────────────── REINFORCEMENT LEARNING ─────────────────────────── */
{
  id: "rl", name: "Reinforcement Learning", short: "RL",
  tagline: "learn to act from reward",
  desc: "Agents that learn by trial and error: MDPs, Bellman equations, Q-learning, policy gradients, PPO, SAC, AlphaZero and RLHF.",
  heroTitle: ["Reinforcement", "Learning"],
  heroSub: "There are no labels, only rewards. An agent acts, the environment responds, and the agent learns a policy that maximises long-term reward. The path runs from tabular Q-learning to deep RL and the RLHF used to align language models.",
  lab: "grid",
  sections: [
  { id: "basics", name: "RL Foundations", lead: "The vocabulary and maths behind every RL algorithm.", items: [
    { t: "Agent–Environment Loop", tags: ["core"],
      d: "At each step the agent observes state sₜ, takes action aₜ, and receives reward rₜ₊₁ and the next state. The goal is to maximise cumulative reward, not the immediate reward.",
      f: "sₜ →(aₜ)→ rₜ₊₁, sₜ₊₁ →(aₜ₊₁)→ …" },
    { t: "Markov Decision Process", tags: ["formalism"],
      d: "An MDP is the tuple (S, A, P, R, γ). The Markov property says the future depends only on the current state, not on the history.",
      f: "P(sₜ₊₁ | sₜ, aₜ) = P(sₜ₊₁ | s₀, a₀, …, sₜ, aₜ)" },
    { t: "Return & Discount Factor", tags: ["core"],
      d: "The return is the discounted sum of future rewards. With γ near 0 the agent is short-sighted; near 1 it plans far ahead. Discounting also keeps infinite sums finite.",
      f: "G_t = r_{t+1} + γ r_{t+2} + γ² r_{t+3} + … = Σₖ γᵏ r_{t+k+1}" },
    { t: "Policy", tags: ["core"],
      d: "The agent's behaviour: either deterministic, a = π(s), or stochastic, π(a|s). RL is the search for the optimal policy π*.",
      f: "π*(s) = argmax_a Q*(s, a)" },
    { t: "Value Functions V, Q & Advantage", tags: ["core"],
      d: "V(s) is how good a state is, Q(s,a) is how good an action is in that state, and the advantage A = Q − V is how much better that action is than average.",
      f: "V^π(s)   = E_π[G_t | s_t = s]\nQ^π(s,a) = E_π[G_t | s_t = s, a_t = a]\nA^π(s,a) = Q^π(s,a) − V^π(s)" },
    { t: "Bellman Equations", tags: ["theory"],
      d: "Recursive definitions of value: the value of a state is the immediate reward plus the discounted value of what comes next. Almost every RL algorithm is built on them.",
      f: "V^π(s) = Σ_a π(a|s) Σ_s' P(s'|s,a)[r + γV^π(s')]\nQ*(s,a) = E[r + γ max_a' Q*(s', a')]" },
    { t: "Exploration vs Exploitation", tags: ["dilemma"],
      d: "Try new actions to learn more, or pick what's known to be best? Strategies include ε-greedy, softmax, UCB, Thompson sampling, entropy bonuses and curiosity." },
    { t: "RL Taxonomy", tags: ["map"],
      d: "Model-free methods learn from experience; model-based methods learn or use the environment's dynamics. Value-based methods learn Q, policy-based methods learn π directly, and actor-critic methods do both. On-policy methods learn from the current policy's data; off-policy methods can reuse old data." },
    { t: "Partial Observability (POMDP)", tags: ["formalism"],
      d: "When the agent sees observations rather than the full state, it needs memory (an RNN, a Transformer, or stacked frames) or a belief over possible states." }
  ]},
  { id: "bandits", name: "Multi-Armed Bandits", lead: "RL with a single state: pure exploration versus exploitation.", items: [
    { t: "The Bandit Problem", tags: ["setting"],
      d: "k slot machines with unknown payouts. You pull arms to maximise total reward, which is the same as minimising regret against always pulling the best arm.",
      f: "Regret_T = T·μ* − Σₜ E[r_t]" },
    { t: "ε-Greedy", tags: ["strategy"],
      d: "Explore a random arm with probability ε and exploit the best-known arm otherwise. Decaying ε over time helps.",
      code: `a = np.random.randint(k) if np.random.rand() < eps else np.argmax(Q)
N[a] += 1
Q[a] += (r - Q[a]) / N[a]   # incremental mean` },
    { t: "Upper Confidence Bound (UCB)", tags: ["strategy"],
      d: "Optimism in the face of uncertainty: choose the arm with the highest optimistic estimate. Arms that have been tried less often get a bonus.",
      f: "aₜ = argmax_a [ Q(a) + c √(ln t / N(a)) ]" },
    { t: "Thompson Sampling", tags: ["bayesian"],
      d: "Sample from each arm's posterior and pull the arm with the best sample. It's simple and very effective in practice.",
      code: `theta = np.random.beta(wins + 1, losses + 1)
a = np.argmax(theta)` },
    { t: "Contextual Bandits", tags: ["applied"],
      d: "Bandits where the best arm depends on a context x, as in ads, recommendations and news. LinUCB is a common algorithm." }
  ]},
  { id: "dp", name: "Dynamic Programming", lead: "Planning when the model P(s'|s,a) is known.", items: [
    { t: "Policy Evaluation", tags: ["prediction"],
      d: "Apply the Bellman expectation equation repeatedly until V^π converges.",
      f: "V(s) ← Σ_a π(a|s) Σ_s' P(s'|s,a)[r + γV(s')]" },
    { t: "Policy Iteration", tags: ["control"],
      d: "Alternate between evaluating the current policy and improving it by acting greedily with respect to V. It converges in a finite number of steps.",
      f: "π'(s) = argmax_a Σ_s' P(s'|s,a)[r + γV^π(s')]" },
    { t: "Value Iteration", tags: ["control"],
      d: "Apply the Bellman optimality backup directly, then read off the greedy policy at the end.",
      f: "V(s) ← max_a Σ_s' P(s'|s,a)[r + γV(s')]",
      code: `V = np.zeros(nS)
while True:
    Q = np.einsum("ast,ast->as", P, R + gamma * V[None, None, :])
    V_new = Q.max(axis=0)
    if np.abs(V_new - V).max() < 1e-6: break
    V = V_new
policy = Q.argmax(axis=0)` },
    { t: "Generalised Policy Iteration", tags: ["concept"],
      d: "Any interleaving of evaluation and improvement converges to optimal. Almost every RL method is a form of GPI." }
  ]},
  { id: "tabular", name: "Model-Free Tabular", lead: "Learning from sampled experience without a model. Watch Q-learning run in the lab above.", items: [
    { t: "Monte Carlo Methods", tags: ["prediction"],
      d: "Wait until an episode ends, then average the observed returns. The estimates are unbiased but have high variance, and it only works for episodic tasks.",
      f: "V(s) ← V(s) + α[G_t − V(s)]" },
    { t: "Temporal-Difference TD(0)", tags: ["prediction"],
      d: "Updates after every step by bootstrapping from the next state's estimate, which has lower variance but some bias. δ is the TD error.",
      f: "δ = r + γV(s') − V(s)\nV(s) ← V(s) + α δ" },
    { t: "SARSA", tags: ["on-policy"],
      d: "On-policy TD control that learns the value of the policy it actually follows, exploration included. Because of that it's more cautious near hazards.",
      f: "Q(s,a) ← Q(s,a) + α[r + γQ(s',a') − Q(s,a)]" },
    { t: "Q-Learning", tags: ["off-policy"],
      d: "Off-policy TD control that learns the optimal Q regardless of how the agent explores. It's the algorithm running in the gridworld lab above.",
      f: "Q(s,a) ← Q(s,a) + α[r + γ max_a' Q(s',a') − Q(s,a)]",
      pros: ["Simple", "Converges to Q* (tabular)"], cons: ["Overestimation bias", "Tabular only as-is"],
      code: `for ep in range(episodes):
    s, _ = env.reset(); done = False
    while not done:
        a = env.action_space.sample() if np.random.rand() < eps else Q[s].argmax()
        s2, r, term, trunc, _ = env.step(a); done = term or trunc
        Q[s, a] += alpha * (r + gamma * Q[s2].max() * (not term) - Q[s, a])
        s = s2` },
    { t: "Expected SARSA", tags: ["TD"],
      d: "Uses the expected value over next actions instead of a single sample, which lowers variance. It generalises both SARSA and Q-learning.",
      f: "target = r + γ Σ_a' π(a'|s') Q(s',a')" },
    { t: "n-step TD & TD(λ)", tags: ["TD"],
      d: "Sits between TD (one step) and Monte Carlo (the whole episode). Eligibility traces spread credit back over recent states.",
      f: "G_t^(n) = r_{t+1} + … + γⁿ⁻¹r_{t+n} + γⁿV(s_{t+n})" },
    { t: "Monte Carlo vs TD", tags: ["compare"],
      d: "MC estimates are unbiased but have high variance and need complete episodes. TD estimates are biased but have low variance, work online, and usually learn faster." }
  ]},
  { id: "deepq", name: "Deep Value-Based RL", lead: "Replacing the Q-table with a neural network.", items: [
    { t: "Function Approximation", tags: ["concept"],
      d: "Large state spaces need Q_θ(s,a) instead of a table. The 'deadly triad' of function approximation, bootstrapping and off-policy learning can make training diverge." },
    { t: "DQN", tags: ["2015", "Atari"],
      d: "Q-learning with a CNN, an experience replay buffer that breaks correlations between samples, and a slowly updated target network that stabilises the targets. It reached human-level play on many Atari games.",
      f: "L(θ) = E[(r + γ max_a' Q_θ⁻(s',a') − Q_θ(s,a))²]",
      code: `q = q_net(s).gather(1, a)
with torch.no_grad():
    target = r + gamma * target_net(s2).max(1, keepdim=True)[0] * (1 - done)
loss = F.smooth_l1_loss(q, target)` },
    { t: "Double DQN", tags: ["fix"],
      d: "The online network picks the next action and the target network evaluates it, which fixes Q-learning's overestimation bias.",
      f: "target = r + γ Q_θ⁻(s', argmax_a' Q_θ(s', a'))" },
    { t: "Dueling DQN", tags: ["architecture"],
      d: "Splits the network into a state-value stream and an advantage stream, so it can learn which states matter without evaluating every action.",
      f: "Q(s,a) = V(s) + A(s,a) − mean_a' A(s,a')" },
    { t: "Prioritised Experience Replay", tags: ["sampling"],
      d: "Replays transitions with a large TD error more often, with importance-sampling weights to correct the resulting bias.",
      f: "P(i) ∝ |δᵢ|^α" },
    { t: "Rainbow & Distributional RL", tags: ["combo"],
      d: "Rainbow combines Double, Dueling, PER, n-step returns, noisy nets and distributional value learning (C51), which learns the full distribution of returns instead of just the mean." }
  ]},
  { id: "pg", name: "Policy Gradient & Actor-Critic", lead: "Optimising the policy directly. This is the family behind PPO and SAC.", items: [
    { t: "Policy Gradient Theorem", tags: ["theory"],
      d: "Increase the log-probability of actions in proportion to how good they turned out to be. It works with stochastic policies and continuous actions.",
      f: "∇_θ J(θ) = E_π[ ∇_θ log π_θ(a|s) · G_t ]" },
    { t: "REINFORCE", tags: ["Monte Carlo PG"],
      d: "The simplest policy gradient algorithm: run an episode, compute the returns, and take a gradient step. It has high variance.",
      code: `logp = dist.log_prob(actions)            # from π_θ
returns = discount(rewards, gamma)
returns = (returns - returns.mean()) / (returns.std() + 1e-8)
loss = -(logp * returns).sum()
opt.zero_grad(); loss.backward(); opt.step()` },
    { t: "Baselines & GAE", tags: ["variance ↓"],
      d: "Subtracting a baseline V(s) reduces variance without adding bias. Generalised Advantage Estimation (GAE) uses λ to trade bias against variance.",
      f: "Â_t = Σ_l (γλ)ˡ δ_{t+l},   δ_t = r_t + γV(s_{t+1}) − V(s_t)" },
    { t: "Actor-Critic, A2C & A3C", tags: ["actor-critic"],
      d: "The actor is the policy and the critic is a value function that scores its actions. A2C is synchronous; A3C runs many asynchronous workers.",
      f: "actor:  ∇ log π(a|s) · Â\ncritic: min (r + γV(s') − V(s))²" },
    { t: "TRPO", tags: ["trust region"],
      d: "Constrains each policy update to a KL-divergence trust region, which guarantees monotonic improvement but is complex to implement.",
      f: "max E[(π_θ/π_old) Â]   s.t.  KL(π_old ‖ π_θ) ≤ δ" },
    { t: "PPO", tags: ["workhorse"],
      d: "Proximal Policy Optimisation clips the probability ratio to keep updates small. It's simple, robust, and the default choice for everything from games to RLHF.",
      f: "r_t(θ) = π_θ(a|s) / π_old(a|s)\nL = E[ min( r_t Â_t , clip(r_t, 1−ε, 1+ε) Â_t ) ]",
      pros: ["Stable", "Easy to tune", "Works for discrete and continuous actions"], cons: ["On-policy, so sample-hungry"],
      code: `from stable_baselines3 import PPO
model = PPO("MlpPolicy", "CartPole-v1", verbose=1)
model.learn(total_timesteps=100_000)` },
    { t: "DDPG & TD3", tags: ["continuous", "off-policy"],
      d: "A deterministic actor with a Q critic for continuous actions. TD3 adds twin critics (taking the minimum), delayed actor updates and target smoothing." },
    { t: "Soft Actor-Critic (SAC)", tags: ["max-entropy"],
      d: "Off-policy actor-critic that maximises reward plus policy entropy, which encourages exploration and robustness. It's a strong default for continuous control and robotics.",
      f: "J(π) = Σ E[ r(s,a) + α H(π(·|s)) ]",
      code: `from stable_baselines3 import SAC
SAC("MlpPolicy", "Pendulum-v1").learn(50_000)` }

  { id: "advanced", name: "Model-Based & Frontiers", lead: "Planning, learning from data or humans, and multi-agent RL.", items: [
    { t: "Model-Based RL & Dyna", tags: ["planning"],
      d: "Learn a dynamics model P̂(s'|s,a) and plan with it, or use it to generate imagined experience (Dyna). It's far more sample-efficient, but errors in the model compound." },
    { t: "AlphaGo, AlphaZero, MuZero", tags: ["MCTS"],
      d: "Monte Carlo Tree Search guided by policy and value networks, trained through self-play. MuZero also learns the model it plans with." },
    { t: "World Models & Dreamer", tags: ["latent imagination"],
      d: "Learn a compact latent model of the world and train the policy entirely inside imagined rollouts." },
    { t: "Imitation Learning", tags: ["from demos"],
      d: "Behaviour cloning is supervised learning on expert (s, a) pairs and suffers from compounding errors. DAgger fixes this by querying the expert on the learner's own states. Inverse RL recovers the reward function itself." },
    { t: "Offline RL", tags: ["from logs"],
      d: "Learning from a fixed dataset without interacting with the environment. The core problem is distribution shift, and methods like CQL and IQL stay conservative about unseen actions." },
    { t: "Multi-Agent RL", tags: ["MARL"],
      d: "Multiple agents that cooperate or compete, which makes the environment non-stationary from each agent's point of view. Common approaches include centralised training with decentralised execution (MAPPO, QMIX) and self-play." },
    { t: "RLHF", tags: ["LLM alignment"],
      d: "Train a reward model on human preference pairs, then optimise the language model with PPO and a KL penalty that keeps it close to the reference model. DPO skips the reward model and optimises on the preferences directly.",
      f: "max_π E[r_φ(x, y)] − β KL(π(·|x) ‖ π_ref(·|x))" },
    { t: "Reward Shaping & Hacking", tags: ["pitfall"],
      d: "Shaping adds dense hints to a sparse reward; potential-based shaping is guaranteed not to change the optimal policy. Reward hacking is when the agent exploits loopholes in the reward instead of doing the task.",

    { t: "Challenges in RL", tags: ["reality check"],
      d: "Sample inefficiency, sparse rewards, instability, sensitivity to hyperparameters and random seeds, the sim-to-real gap, and safe exploration." }
  ]},
  { id: "toolbox", name: "Toolbox", lead: "Environments and libraries for RL.", items: [
    { t: "Gymnasium", tags: ["environments"],

      code: `import gymnasium as gym

for _ in range(500):

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const summary = d => (d.match(/^.*?[.!?](\s|$)/) || [d])[0].trim();
const pad2 = n => String(n).padStart(2, "0");
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

function hlPy(src) {
  const re = /("""[\s\S]*?"""|'[^'\n]*'|"[^"\n]*")|(#.*$)|\b(def|return|for|in|if|else|elif|import|from|as|with|while|class|lambda|and|or|not|is|True|False|None|break|continue|pass|yield)\b|\b(\d[\d_]*\.?\d*(?:e-?\d+)?)\b/gm;
  let out = "", last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    const cls = m[1] ? "tk-s" : m[2] ? "tk-c" : m[3] ? "tk-k" : "tk-n";
    out += `<span class="${cls}">${esc(m[0])}</span>`;
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}

function setupCanvas(cv) {
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  if (!w || !h) return null;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w, h };
}

  if (q) { renderSearch(q); show("search"); return; }
  const [t, s] = location.hash.slice(1).split("/");
  if (t === "play") {
    const same = currentView === "play";
    show("play"); pgOpen(s);
    if (!same) window.scrollTo({ top: 0, behavior: "instant" });
    return;
  }
  if (TR[t]) {
    const same = currentView === t;
    show(t);
    if (s) {
      const target = document.getElementById(`${t}-${s}`);
      if (target) requestAnimationFrame(() => target.scrollIntoView({ behavior: same && !REDUCED ? "smooth" : "instant" }));
    } else if (!same) window.scrollTo({ top: 0, behavior: "instant" });
  } else {
    const same = currentView === "home";
    show("home");
    if (!same) window.scrollTo({ top: 0, behavior: "instant" });
  }
}
window.addEventListener("hashchange", () => { if (search.value) search.value = ""; route(); });
search.addEventListener("input", () => {
  if (search.value.trim()) window.scrollTo({ top: 0, behavior: "instant" });
  route();
});
document.addEventListener("keydown", e => {
  if (modal.open) {
    if (e.key === "ArrowLeft" && modal._prev !== undefined) openModal(modal._prev);
    if (e.key === "ArrowRight" && modal._next !== undefined) openModal(modal._next);
    return;
  }
  if (e.key === "/" && !e.target.closest("input, textarea, select, .CodeMirror")) { e.preventDefault(); search.focus(); }
  if (e.key === "Escape" && search.value) { search.value = ""; search.blur(); route(); }
});

/* =========================================================================
   HERO — animated neural network (ML → DL → RL colours)
   ========================================================================= */
const Hero = {
  raf: 0, nodes: [], edges: [], pulses: [], layers: [], L: 0, last: 0, c: null,
  build() {
    const cv = $("#hero-cv"); if (!cv) return false;
    const s = setupCanvas(cv); if (!s) return false;
    const { w, h } = s;
    const L = w < 700 ? 5 : 7, x0 = w < 700 ? w * 0.08 : w * 0.5, x1 = w * 0.95;
    this.nodes = []; this.edges = []; this.layers = []; this.pulses = []; this.L = L;
    for (let l = 0; l < L; l++) {
      const n = 3 + Math.floor(Math.random() * 4), layer = [];
      for (let k = 0; k < n; k++) {
        const node = { x: x0 + (x1 - x0) * l / (L - 1), y: h * (0.14 + 0.72 * (k + 0.5) / n) + (Math.random() - .5) * 18, l, glow: 0 };
        this.nodes.push(node); layer.push(node);
      }
      this.layers.push(layer);
    }
    for (let l = 0; l < L - 1; l++) this.layers[l].forEach(a => this.layers[l + 1].forEach(b => this.edges.push({ a, b })));
    return true;
  },
  color(l) {
    const t = l / (this.L - 1);
    return t < 0.34 ? this.c.ml : t < 0.67 ? this.c.dl : this.c.rl;
  },
  readColors() { this.c = { ml: cssv("--ml"), dl: cssv("--dl"), rl: cssv("--rl"), line: cssv("--line-2"), surf: cssv("--surface") }; },
  draw() {
    const cv = $("#hero-cv"); if (!cv || !this.nodes.length) return;
    const s = setupCanvas(cv); if (!s) return;
    if (!this.c) this.readColors();
    const { ctx, w, h } = s;
    ctx.clearRect(0, 0, w, h);
    ctx.lineWidth = 1; ctx.strokeStyle = this.c.line; ctx.globalAlpha = .6;
    ctx.beginPath();
    this.edges.forEach(({ a, b }) => { ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); });
    ctx.stroke();
    ctx.globalAlpha = 1;
    this.pulses.forEach(p => {
      const x = p.a.x + (p.b.x - p.a.x) * p.t, y = p.a.y + (p.b.y - p.a.y) * p.t;
      const tt = Math.max(0, p.t - .14), tx = p.a.x + (p.b.x - p.a.x) * tt, ty = p.a.y + (p.b.y - p.a.y) * tt;
      const g = ctx.createLinearGradient(tx, ty, x, y);
      g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, p.c);
      ctx.strokeStyle = g; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(x, y); ctx.stroke();
      ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(x, y, 2.4, 0, 7); ctx.fill();
    });
    this.nodes.forEach(n => {
      const c = this.color(n.l);
      if (n.glow > .02) {
        ctx.globalAlpha = n.glow * .45; ctx.fillStyle = c;
        ctx.beginPath(); ctx.arc(n.x, n.y, 7 + n.glow * 10, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
      }
      ctx.fillStyle = this.c.surf; ctx.strokeStyle = c; ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.arc(n.x, n.y, 5.5, 0, 7); ctx.fill(); ctx.stroke();
      ctx.fillStyle = c; ctx.globalAlpha = .35 + n.glow * .65;
      ctx.beginPath(); ctx.arc(n.x, n.y, 2.6, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
    });
  },
  spawn(from) {
    const nextL = this.layers[from.l + 1]; if (!nextL) return;
    const b = nextL[Math.floor(Math.random() * nextL.length)];
    this.pulses.push({ a: from, b, t: 0, v: .012 + Math.random() * .01, c: this.color(from.l) });
  },
  tick(ts) {
    const dt = Math.min(50, ts - (this.last || ts)); this.last = ts;
    if (Math.random() < .08) { const l0 = this.layers[0]; this.spawn(l0[Math.floor(Math.random() * l0.length)]); }
    const arrived = [];
    this.pulses = this.pulses.filter(p => {
      p.t += p.v * dt / 16;
      if (p.t >= 1) { arrived.push(p.b); return false; }
      return true;
    });
    arrived.forEach(n => {
      n.glow = 1;
      if (this.pulses.length < 60) { if (Math.random() < .8) this.spawn(n); if (Math.random() < .2) this.spawn(n); }
    });
    this.nodes.forEach(n => { n.glow *= .94; });
    this.draw();
    this.raf = requestAnimationFrame(t => this.tick(t));
  },
  start() {
    this.stop();
    requestAnimationFrame(() => {
      this.readColors();
      if (!this.build()) return;
      if (REDUCED) { this.draw(); return; }
      this.last = 0;
      this.raf = requestAnimationFrame(t => this.tick(t));
    });
  },
  stop() { cancelAnimationFrame(this.raf); this.raf = 0; }
};
let resizeT = 0;
window.addEventListener("resize", () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => { if (currentView === "home") Hero.start(); }, 150);
});

/* =========================================================================
   LABS
   ========================================================================= */
const PAL = ["#14b8a6", "#8b5cf6", "#f59e0b", "#ec4899", "#3b82f6", "#ef4444", "#84cc16", "#06b6d4"];
const LABS = {};

/* ---------- ML: k-means playground ---------- */
LABS.kmeans = (() => {
  const S = { pts: [], cents: [], asg: [], iter: 0, phase: "assign", done: false, timer: 0 };
  const gauss = () => Math.sqrt(-2 * Math.log(1 - Math.random())) * Math.cos(2 * Math.PI * Math.random());
  const d2 = (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2;
  const nearest = p => { let bi = 0, bd = Infinity; S.cents.forEach((c, i) => { const d = d2(p, c); if (d < bd) { bd = d; bi = i; } }); return bi; };
  const k = () => +$("#km-k").value;

  function newData() {
    const nc = 3 + Math.floor(Math.random() * 3);
    S.pts = [];
    for (let c = 0; c < nc; c++) {
      const cx = .15 + Math.random() * .7, cy = .15 + Math.random() * .7, sd = .04 + Math.random() * .04;
      for (let i = 0; i < 55; i++) S.pts.push({ x: Math.min(.98, Math.max(.02, cx + gauss() * sd)), y: Math.min(.98, Math.max(.02, cy + gauss() * sd)) });
    }
    reinit();
  }
  function reinit() {
    stop();
    const idx = [...S.pts.keys()].sort(() => Math.random() - .5).slice(0, k());
    S.cents = idx.map(i => ({ ...S.pts[i] }));
    S.asg = S.pts.map(() => -1); S.iter = 0; S.phase = "assign"; S.done = false;
    stats(); draw();
  }
  function step() {
    if (S.done) return;
    if (S.phase === "assign") {
      let changed = false;
      S.pts.forEach((p, i) => { const a = nearest(p); if (a !== S.asg[i]) changed = true; S.asg[i] = a; });
      if (!changed && S.iter > 0) S.done = true; else S.phase = "update";
    } else {
      S.cents = S.cents.map((c, j) => {
        const mem = S.pts.filter((_, i) => S.asg[i] === j);
        return mem.length ? { x: mem.reduce((s, p) => s + p.x, 0) / mem.length, y: mem.reduce((s, p) => s + p.y, 0) / mem.length } : c;
      });
      S.iter++; S.phase = "assign";
    }
    stats(); draw();
    if (S.done) stop();
  }
  function run() {
    if (S.timer) return stop();
    if (S.done) reinit();
    const b = $("#km-run"); b.textContent = "Pause"; b.classList.add("on");
    S.timer = setInterval(step, 420);
  }
  function stop() {
    clearInterval(S.timer); S.timer = 0;
    const b = $("#km-run"); if (b) { b.textContent = "Run"; b.classList.remove("on"); }
  }
  function stats() {
    const J = S.asg.length && S.asg.every(a => a >= 0) ? S.pts.reduce((s, p, i) => s + d2(p, S.cents[S.asg[i]]), 0) : null;
    $("#km-it").textContent = S.iter;
    $("#km-j").textContent = J === null ? "–" : J.toFixed(3);
    $("#km-st").textContent = S.done ? "converged ✓" : S.phase === "assign" ? "assign points →" : "move centroids →";
  }
  function draw() {
    const cv = $("#km-cv"); if (!cv) return;
    const s = setupCanvas(cv); if (!s) return;
    const { ctx, w, h } = s;
    ctx.clearRect(0, 0, w, h);
    if (S.asg.some(a => a >= 0)) {  // Voronoi shading
      const g = 10;
      ctx.globalAlpha = .1;
      for (let x = 0; x < w; x += g) for (let y = 0; y < h; y += g) {
        ctx.fillStyle = PAL[nearest({ x: (x + g / 2) / w, y: (y + g / 2) / h }) % PAL.length];
        ctx.fillRect(x, y, g, g);
      }
      ctx.globalAlpha = 1;
    }
    const muted = cssv("--muted");
    S.pts.forEach((p, i) => {
      ctx.fillStyle = S.asg[i] >= 0 ? PAL[S.asg[i] % PAL.length] : muted;
      ctx.globalAlpha = S.asg[i] >= 0 ? .9 : .6;
      ctx.beginPath(); ctx.arc(p.x * w, p.y * h, 3.4, 0, 7); ctx.fill();
    });
    ctx.globalAlpha = 1;
    const surf = cssv("--surface");
    S.cents.forEach((c, j) => {
      const cx = c.x * w, cy = c.y * h;
      ctx.fillStyle = PAL[j % PAL.length]; ctx.strokeStyle = surf; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(cx, cy, 10, 0, 7); ctx.fill(); ctx.stroke();
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(cx - 4, cy); ctx.lineTo(cx + 4, cy); ctx.moveTo(cx, cy - 4); ctx.lineTo(cx, cy + 4); ctx.stroke();
    });
  }
  return {
    html: () => `<div class="lab" data-track="ml"><div class="lab-in">
      <div class="lab-head"><div><span class="eyebrow"><span class="dot"></span>Interactive lab</span>
        <h3>k-Means Clustering Playground</h3>
        <p>Watch k-means alternate between <b>assigning</b> each point to its nearest centroid and <b>moving</b> each centroid to the mean of its points. Click the canvas to add points. Try a few different starting centroids, because k-means can get stuck in a local optimum.</p></div></div>
      <div class="lab-body">
        <canvas id="km-cv" class="lab-cv" aria-label="k-means clustering canvas"></canvas>
        <div class="ctrl">
          <label><span class="row">Clusters k <b id="km-kv">4</b></span><input type="range" id="km-k" min="2" max="7" value="4"></label>
          <div class="btns"><button id="km-run" class="primary">Run</button><button id="km-step">Step</button><button id="km-re">New centroids</button><button id="km-new">New data</button></div>
          <div class="kv"><div><span>Iteration</span><b id="km-it">0</b></div><div><span>Inertia J</span><b id="km-j">–</b></div><div style="grid-column:span 2"><span>Next step</span><b id="km-st">–</b></div></div>
          <pre class="formula">J = Σₖ Σ_{x∈Cₖ} ‖x − μₖ‖²</pre>
        </div>
      </div></div></div>`,
    init() {
      $("#km-k").oninput = e => { $("#km-kv").textContent = e.target.value; reinit(); };
      $("#km-run").onclick = run; $("#km-step").onclick = () => { stop(); step(); };
      $("#km-re").onclick = reinit; $("#km-new").onclick = newData;
      $("#km-cv").onclick = e => {
        const r = e.currentTarget.getBoundingClientRect();
        const p = { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height };
        S.pts.push(p); S.asg.push(S.asg.some(a => a >= 0) ? nearest(p) : -1); S.done = false; stats(); draw();
      };
      window.addEventListener("resize", draw);
      newData();
    },
    draw
  };
})();

/* ---------- DL: activation function explorer ---------- */
LABS.act = (() => {
  const sig = x => 1 / (1 + Math.exp(-x));
  const erf = x => { const s = Math.sign(x); x = Math.abs(x); const t = 1 / (1 + .3275911 * x);
    return s * (1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - .284496736) * t + .254829592) * t * Math.exp(-x * x)); };
  const F = {
    Sigmoid: sig, Tanh: Math.tanh, ReLU: x => Math.max(0, x), "Leaky ReLU": x => x > 0 ? x : .1 * x,
    ELU: x => x > 0 ? x : Math.exp(x) - 1, GELU: x => .5 * x * (1 + erf(x / Math.SQRT2)),
    Swish: x => x * sig(x), Softplus: x => Math.log1p(Math.exp(x))
  };
  const names = Object.keys(F);
  const col = n => PAL[names.indexOf(n) % PAL.length];
  const on = new Set(["Sigmoid", "ReLU", "GELU"]);
  let deriv = false, hx = null;
  const g = (f, x) => deriv ? (f(x + 1e-3) - f(x - 1e-3)) / 2e-3 : f(x);

  function draw() {
    const cv = $("#act-cv"); if (!cv) return;
    const s = setupCanvas(cv); if (!s) return;
    const { ctx, w, h } = s;
    const xr = [-5, 5], yr = deriv ? [-.4, 1.4] : [-1.5, 3.2];
    const X = x => (x - xr[0]) / (xr[1] - xr[0]) * w, Y = y => h - (y - yr[0]) / (yr[1] - yr[0]) * h;
    ctx.clearRect(0, 0, w, h);
    const line = cssv("--line"), muted = cssv("--muted");
    ctx.lineWidth = 1; ctx.strokeStyle = line; ctx.fillStyle = muted; ctx.font = "11px JetBrains Mono, monospace";
    for (let x = -5; x <= 5; x++) { ctx.beginPath(); ctx.moveTo(X(x), 0); ctx.lineTo(X(x), h); ctx.stroke(); if (x) ctx.fillText(x, X(x) + 3, Y(0) - 5); }
    const ys = deriv ? .2 : .5;
    for (let y = Math.ceil(yr[0] / ys) * ys; y <= yr[1] + 1e-9; y += ys) { ctx.beginPath(); ctx.moveTo(0, Y(y)); ctx.lineTo(w, Y(y)); ctx.stroke(); if (Math.abs(y) > 1e-9) ctx.fillText(+y.toFixed(1), X(0) + 5, Y(y) - 3); }
    ctx.strokeStyle = muted; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(0, Y(0)); ctx.lineTo(w, Y(0)); ctx.moveTo(X(0), 0); ctx.lineTo(X(0), h); ctx.stroke();
    on.forEach(n => {
      ctx.strokeStyle = col(n); ctx.lineWidth = 2.6; ctx.beginPath();
      for (let px = 0; px <= w; px++) { const x = xr[0] + px / w * (xr[1] - xr[0]), py = Y(g(F[n], x)); px ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
      ctx.stroke();
    });
    if (hx !== null) {
      ctx.strokeStyle = muted; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(X(hx), 0); ctx.lineTo(X(hx), h); ctx.stroke(); ctx.setLineDash([]);
      const surf = cssv("--surface");
      on.forEach(n => { ctx.fillStyle = col(n); ctx.strokeStyle = surf; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(X(hx), Y(g(F[n], hx)), 5, 0, 7); ctx.fill(); ctx.stroke(); });
    }
    $("#act-leg").innerHTML = (hx !== null ? `<span>x = ${hx.toFixed(2)}</span>` : "") +
      [...on].map(n => `<span><i style="background:${col(n)}"></i>${n}${hx !== null ? ` = ${g(F[n], hx).toFixed(3)}` : ""}</span>`).join("");
  }
  return {
    html: () => `<div class="lab" data-track="dl"><div class="lab-in">
      <div class="lab-head"><div><span class="eyebrow"><span class="dot"></span>Interactive lab</span>
        <h3>Activation Function Explorer</h3>
        <p>Compare the non-linearities that power neural networks, then switch to the <b>derivative</b> view to see why sigmoid and tanh cause vanishing gradients while ReLU doesn't. Hover over the chart to read exact values.</p></div></div>
      <div class="lab-body">
        <div><canvas id="act-cv" class="lab-cv" aria-label="Activation function plot"></canvas><div class="legend" id="act-leg"></div></div>
        <div class="ctrl">
          <div class="btns">${names.map(n => `<button data-act="${n}" class="${on.has(n) ? "on" : ""}">${n}</button>`).join("")}</div>
          <button id="act-d">Show derivative f′(x)</button>
          <p class="hint">Notice the sigmoid derivative never goes above 0.25. Multiply that through 10 layers and the gradient all but disappears.</p>
        </div>
      </div></div></div>`,
    init() {
      document.querySelectorAll("[data-act]").forEach(b => b.onclick = () => {
        const n = b.dataset.act; on.has(n) ? on.delete(n) : on.add(n); b.classList.toggle("on"); draw();
      });
      const d = $("#act-d");
      d.onclick = () => { deriv = !deriv; d.classList.toggle("on", deriv); d.textContent = deriv ? "Show function f(x)" : "Show derivative f′(x)"; draw(); };
      const cv = $("#act-cv");
      const move = e => { const r = cv.getBoundingClientRect(); hx = Math.max(-5, Math.min(5, -5 + (e.clientX - r.left) / r.width * 10)); draw(); };
      cv.addEventListener("pointermove", move);
      cv.addEventListener("pointerdown", move);
      cv.addEventListener("pointerleave", () => { hx = null; draw(); });
      window.addEventListener("resize", draw);
    },
    draw
  };
})();

/* ---------- RL: Q-learning gridworld ---------- */
LABS.grid = (() => {
  const MAP = ["....T..G", ".##..#..", "...#.#.T", ".T.#....", "..##.T#.", "S......."];
  const W = 8, H = 6, A = [[0, -1], [1, 0], [0, 1], [-1, 0]];
  const grid = MAP.map(r => r.split(""));
  const start = { x: 0, y: 5 };
  const Q = new Float32Array(W * H * 4);
  let returns = [], eps = 0, training = false, raf = 0, agent = null, animT = 0;
  const P = () => ({ a: +$("#gw-a").value, g: +$("#gw-g").value, e: +$("#gw-e").value });
  const sid = (x, y) => y * W + x;
  const maxQ = s => Math.max(Q[s * 4], Q[s * 4 + 1], Q[s * 4 + 2], Q[s * 4 + 3]);
  const known = s => Q[s * 4] !== 0 || Q[s * 4 + 1] !== 0 || Q[s * 4 + 2] !== 0 || Q[s * 4 + 3] !== 0;
  const greedy = s => { const m = maxQ(s), c = [0, 1, 2, 3].filter(a => Q[s * 4 + a] === m); return c[Math.floor(Math.random() * c.length)]; };
  const argmaxFirst = s => { let b = 0; for (let a = 1; a < 4; a++) if (Q[s * 4 + a] > Q[s * 4 + b]) b = a; return b; };

  function envStep(x, y, a) {
    let nx = x + A[a][0], ny = y + A[a][1];
    if (nx < 0 || ny < 0 || nx >= W || ny >= H || grid[ny][nx] === "#") { nx = x; ny = y; }
    const c = grid[ny][nx];
    if (c === "G") return [nx, ny, 10, true];
    if (c === "T") return [nx, ny, -10, true];
    return [nx, ny, -0.1, false];
  }
  function episode(p) {
    let x = start.x, y = start.y, G = 0;
    for (let t = 0; t < 200; t++) {
      const s = sid(x, y), a = Math.random() < p.e ? Math.floor(Math.random() * 4) : greedy(s);
      const [nx, ny, r, done] = envStep(x, y, a);
      const target = r + (done ? 0 : p.g * maxQ(sid(nx, ny)));
      Q[s * 4 + a] += p.a * (target - Q[s * 4 + a]);
      G += r; x = nx; y = ny;
      if (done) break;
    }
    returns.push(G); eps++;
    if (returns.length > 5000) returns = returns.slice(-3000);
  }
  function greedyPath() {
    let x = start.x, y = start.y; const path = [{ x, y }];
    for (let t = 0; t < 60; t++) {
      const s = sid(x, y); if (!known(s)) return { path, ok: false };
      const [nx, ny, , done] = envStep(x, y, argmaxFirst(s)); x = nx; y = ny; path.push({ x, y });
      if (done) return { path, ok: grid[y][x] === "G" };
    }
    return { path, ok: false };
  }
  function loop() {
    const p = P();
    for (let i = 0; i < 8; i++) episode(p);
    draw(); stats();
    raf = requestAnimationFrame(loop);
  }
  function setTraining(v) {
    training = v;
    const b = $("#gw-train");
    b.textContent = training ? "Pause" : "Train"; b.classList.toggle("on", training);
    cancelAnimationFrame(raf);
    if (training) loop();
  }
  function burst() { const p = P(); for (let i = 0; i < 500; i++) episode(p); draw(); stats(); }
  function reset() { setTraining(false); clearInterval(animT); Q.fill(0); returns = []; eps = 0; agent = null; draw(); stats(); }
  function runAgent() {
    setTraining(false);
    const { path } = greedyPath(); let i = 0;
    clearInterval(animT);
    animT = setInterval(() => {
      agent = path[i++]; draw();
      if (i >= path.length) { clearInterval(animT); setTimeout(() => { agent = null; draw(); }, 900); }
    }, 160);
  }
  function stats() {
    const last = returns.slice(-100);
    $("#gw-ep").textContent = eps.toLocaleString();
    $("#gw-ret").textContent = last.length ? (last.reduce((a, b) => a + b, 0) / last.length).toFixed(2) : "–";
    const gp = greedyPath(), el = $("#gw-pol");
    el.textContent = gp.ok ? `reaches +10 in ${gp.path.length - 1} steps ✓` : "not solved yet";
    el.style.color = gp.ok ? "var(--good)" : "var(--muted)";
    spark();
  }
  function spark() {
    const cv = $("#gw-spark"); if (!cv) return;
    const s = setupCanvas(cv); if (!s) return;
    const { ctx, w, h } = s; ctx.clearRect(0, 0, w, h);
    if (returns.length < 2) { ctx.fillStyle = cssv("--muted"); ctx.font = "11px JetBrains Mono, monospace"; ctx.fillText("return per episode (moving avg)", 10, h / 2 + 4); return; }
    const win = 30, ma = [];
    let acc = 0;
    returns.forEach((r, i) => { acc += r; if (i >= win) acc -= returns[i - win]; ma.push(acc / Math.min(i + 1, win)); });
    const lo = -12, hi = 10, n = ma.length;
    const Y = v => h - 6 - (Math.max(lo, Math.min(hi, v)) - lo) / (hi - lo) * (h - 12);
    ctx.strokeStyle = cssv("--line-2"); ctx.lineWidth = 1; ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(0, Y(0)); ctx.lineTo(w, Y(0)); ctx.stroke(); ctx.setLineDash([]);
    ctx.strokeStyle = cssv("--rl"); ctx.lineWidth = 2; ctx.beginPath();
    const stepN = Math.max(1, Math.floor(n / w));
    for (let i = 0; i < n; i += stepN) { const x = i / (n - 1) * w; i ? ctx.lineTo(x, Y(ma[i])) : ctx.moveTo(x, Y(ma[i])); }
    ctx.stroke();
  }
  function geom(w, h) { const cs = Math.min(w / W, h / H); return { cs, ox: (w - cs * W) / 2, oy: (h - cs * H) / 2 }; }
  function draw() {
    const cv = $("#gw-cv"); if (!cv) return;
    const s = setupCanvas(cv); if (!s) return;
    const { ctx, w, h } = s;
    ctx.clearRect(0, 0, w, h);
    const { cs, ox, oy } = geom(w, h);
    const good = cssv("--good"), bad = cssv("--bad"), rl = cssv("--rl"), wall = cssv("--wall"), ink = cssv("--ink"), muted = cssv("--muted"), surf = cssv("--surface");
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const c = grid[y][x], px = ox + x * cs, py = oy + y * cs, s0 = sid(x, y);
      ctx.fillStyle = c === "#" ? wall : surf; ctx.fillRect(px + 1.5, py + 1.5, cs - 3, cs - 3);
      if (c === "#") continue;
      if (c === "G" || c === "T") {
        const col = c === "G" ? good : bad;
        ctx.fillStyle = col; ctx.globalAlpha = .25; ctx.fillRect(px + 1.5, py + 1.5, cs - 3, cs - 3); ctx.globalAlpha = 1;
        ctx.font = `600 ${Math.max(11, cs * .22)}px JetBrains Mono, monospace`;
        ctx.fillText(c === "G" ? "+10" : "−10", px + cs / 2, py + cs / 2);
        continue;
      }
      if (known(s0)) {
        const v = maxQ(s0);
        ctx.fillStyle = v >= 0 ? rl : bad; ctx.globalAlpha = Math.min(1, Math.abs(v) / 10) * .55 + .06;
        ctx.fillRect(px + 1.5, py + 1.5, cs - 3, cs - 3); ctx.globalAlpha = 1;
        const a = argmaxFirst(s0), L = cs * .2;
        ctx.save(); ctx.translate(px + cs / 2, py + cs / 2); ctx.rotate([-Math.PI / 2, 0, Math.PI / 2, Math.PI][a]);
        ctx.strokeStyle = ink; ctx.fillStyle = ink; ctx.globalAlpha = .75; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(-L, 0); ctx.lineTo(L * .4, 0); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(L, 0); ctx.lineTo(L * .3, -L * .5); ctx.lineTo(L * .3, L * .5); ctx.closePath(); ctx.fill();
        ctx.restore(); ctx.globalAlpha = 1;
        if (cs > 54) { ctx.fillStyle = muted; ctx.font = "10px JetBrains Mono, monospace"; ctx.fillText(v.toFixed(1), px + cs / 2, py + cs - 11); }
      }
      if (x === start.x && y === start.y) { ctx.fillStyle = ink; ctx.font = `700 ${Math.max(11, cs * .2)}px Space Grotesk, sans-serif`; ctx.fillText("S", px + cs * .2, py + cs * .22); }
    }
    if (agent) {
      ctx.fillStyle = rl; ctx.strokeStyle = surf; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(ox + agent.x * cs + cs / 2, oy + agent.y * cs + cs / 2, cs * .22, 0, 7); ctx.fill(); ctx.stroke();
    }
  }
  return {
    html: () => `<div class="lab" data-track="rl"><div class="lab-in">
      <div class="lab-head"><div><span class="eyebrow"><span class="dot"></span>Interactive lab</span>
        <h3>Q-Learning Gridworld</h3>
        <p>The agent starts at <b>S</b> and has to reach <b>+10</b> while avoiding the <b>−10</b> traps, paying −0.1 per step. Press Train and watch the values (colour) and the greedy policy (arrows) spread backwards from the goal. Click a cell to cycle it between empty, wall and trap.</p></div></div>
      <div class="lab-body">
        <canvas id="gw-cv" class="lab-cv" aria-label="Gridworld with Q-values and policy arrows"></canvas>
        <div class="ctrl">
          <label><span class="row">Learning rate α <b id="gw-av">0.30</b></span><input type="range" id="gw-a" min="0.02" max="1" step="0.02" value="0.3"></label>
          <label><span class="row">Discount γ <b id="gw-gv">0.95</b></span><input type="range" id="gw-g" min="0.5" max="0.99" step="0.01" value="0.95"></label>
          <label><span class="row">Exploration ε <b id="gw-ev">0.15</b></span><input type="range" id="gw-e" min="0" max="0.6" step="0.01" value="0.15"></label>
          <div class="btns"><button id="gw-train" class="primary">Train</button><button id="gw-burst">+500 episodes</button><button id="gw-run">▶ Run agent</button><button id="gw-reset">Reset</button></div>
          <div class="kv"><div><span>Episodes</span><b id="gw-ep">0</b></div><div><span>Avg return</span><b id="gw-ret">–</b></div>
            <div style="grid-column:span 2"><span>Greedy policy</span><b id="gw-pol" style="font-size:14px">not solved yet</b></div></div>
          <canvas id="gw-spark" aria-label="Return per episode chart"></canvas>
        </div>
      </div></div></div>`,
    init() {
      ["a", "g", "e"].forEach(k => { const el = $(`#gw-${k}`); el.oninput = () => { $(`#gw-${k}v`).textContent = (+el.value).toFixed(2); }; });
      $("#gw-train").onclick = () => setTraining(!training);
      $("#gw-burst").onclick = burst; $("#gw-run").onclick = runAgent; $("#gw-reset").onclick = reset;
      $("#gw-cv").onclick = e => {
        const r = e.currentTarget.getBoundingClientRect(), { cs, ox, oy } = geom(r.width, r.height);
        const x = Math.floor((e.clientX - r.left - ox) / cs), y = Math.floor((e.clientY - r.top - oy) / cs);
        if (x < 0 || y < 0 || x >= W || y >= H || grid[y][x] === "G" || (x === start.x && y === start.y)) return;
        grid[y][x] = { ".": "#", "#": "T", "T": "." }[grid[y][x]];
        draw(); stats();
      };
      window.addEventListener("resize", () => { draw(); spark(); });
      stats();
    },
    draw: () => { draw(); spark(); }
  };
})();

const BOOT_PY = `
import os, sys, io, base64, warnings
os.environ["MPLBACKEND"] = "AGG"
warnings.filterwarnings("ignore", module="threadpoolctl")
import _atlas

def _atlas_show(*args, **kwargs):
    import matplotlib.pyplot as plt
    for num in plt.get_fignums():
        fig = plt.figure(num)
        buf = io.BytesIO()
        with warnings.catch_warnings():
            warnings.simplefilter("ignore")
            fig.savefig(buf, format="png", dpi=100, bbox_inches="tight")
        _atlas.image(base64.b64encode(buf.getvalue()).decode())
    plt.close("all")

def _atlas_prepare():
    import matplotlib
    matplotlib.use("Agg")
    import matplotlib.pyplot as plt
    plt.show = _atlas_show

def _atlas_flush():
    if "matplotlib.pyplot" in sys.modules:
        _atlas_show()
`;

const WORKER_SRC = `
import { loadPyodide } from "${PYODIDE_URL}pyodide.mjs";
let py;
const ready = (async () => {
  py = await loadPyodide({ indexURL: "${PYODIDE_URL}" });
  py.setStdout({ batched: s => postMessage({ type: "out", text: s }) });
  py.setStderr({ batched: s => postMessage({ type: "err", text: s }) });
  py.registerJsModule("_atlas", { image: b64 => postMessage({ type: "img", data: b64 }) });
  await py.runPythonAsync(${JSON.stringify(BOOT_PY)});
  postMessage({ type: "ready", version: py.runPython("sys.version.split()[0]") });
})().catch(e => postMessage({ type: "fatal", text: String(e) }));

function cleanTb(msg) {
  const lines = msg.split("\\n");
  const i = lines.findIndex(l => l.includes('File "<exec>"'));
  return i > 0 ? ["Traceback (most recent call last):"].concat(lines.slice(i)).join("\\n").trim() : msg.trim();
}

self.onmessage = async (e) => {
  await ready;
  const code = e.data.code, t0 = performance.now();
  let error = null;
  try {
    await py.loadPackagesFromImports(code, { messageCallback: m => postMessage({ type: "status", text: m }), errorCallback: () => {} });
    if (/matplotlib|\\.plot\\(|plotting/.test(code)) {
      await py.loadPackage("matplotlib", { messageCallback: () => {} });
      py.runPython("_atlas_prepare()");
    }
    postMessage({ type: "started" });
    const ns = py.globals.get("dict")();
    try { await py.runPythonAsync(code, { globals: ns }); }
    finally { py.runPython("_atlas_flush()"); ns.destroy(); }
  } catch (err) { error = cleanTb(String((err && err.message) || err)); }
  postMessage({ type: "done", error, secs: (performance.now() - t0) / 1000 });
};`;

const PG = { worker: null, state: "idle", version: "", running: false, queued: null, cur: null,
             cm: null, cmLoading: null, lines: 0, suppress: false, saveT: 0 };

function pgStatus(state, text) {
  PG.state = state;
  const el = $("#py-status"); if (!el) return;
  el.className = "pill status " + state;
  el.querySelector("span").textContent = text;
}
function pgButtons() {
  $("#pg-run").disabled = PG.running;
  $("#pg-stop").disabled = !PG.running;
}
function pgBoot() {
  if (PG.worker) return;
  pgStatus("loading", "Loading Python…");
  try {
    PG.worker = new Worker(URL.createObjectURL(new Blob([WORKER_SRC], { type: "text/javascript" })), { type: "module" });
  } catch (e) { pgStatus("error", "Python unavailable"); return; }
  PG.worker.onmessage = pgMessage;
  PG.worker.onerror = e => {
    pgStatus("error", "Python failed to load");
    conLine("Could not start Python (" + (e.message || "network error") + "). Check your connection and reload the page.", "e");
    PG.running = false; pgButtons();
  };
}
function pgMessage(e) {
  const m = e.data;
  if (m.type === "ready") {
    PG.version = m.version;
    pgStatus("ready", `Python ${m.version} ready`);
    if (PG.queued !== null) { const code = PG.queued; PG.queued = null; pgStatus("running", "Running…"); PG.worker.postMessage({ code }); }
  } else if (m.type === "fatal") {
    pgStatus("error", "Python failed to load"); conLine(m.text, "e"); PG.running = false; pgButtons();
  } else if (m.type === "status") {
    if (/^Loading /.test(m.text)) { conLine(m.text.replace(/\s+/g, " "), "s"); pgStatus("running", "Downloading libraries…"); }
  } else if (m.type === "started") {
    pgStatus("running", "Running…");
  } else if (m.type === "out") conLine(m.text);
  else if (m.type === "err") conLine(m.text, "e");
  else if (m.type === "img") conImg(m.data);
  else if (m.type === "done") {
    PG.running = false; pgButtons();
    if (m.error) conLine(m.error, "e");
    $("#pg-time").textContent = (m.error ? "✗ error" : "✓ finished") + ` in ${m.secs.toFixed(2)}s`;
    pgStatus("ready", `Python ${PG.version} ready`);
  }
}

/* ---- console ---- */
function conClear() { const o = $("#pg-out"); o.innerHTML = ""; PG.lines = 0; }
function conStick(fn) {
  const o = $("#pg-out"), atEnd = o.scrollHeight - o.scrollTop - o.clientHeight < 40;
  fn(o);
  if (atEnd) o.scrollTop = o.scrollHeight;
}
function conLine(text, cls = "") {
  if (PG.lines > 5000) return;
  if (++PG.lines === 5000) { text = "… output truncated after 5,000 lines"; cls = "s"; }
  conStick(o => {
    const ph = o.querySelector(".ph"); if (ph) ph.remove();
    let last = o.lastChild;
    if (!last || last.nodeName !== "SPAN" || last.className !== cls) { last = document.createElement("span"); last.className = cls; o.appendChild(last); }
    last.appendChild(document.createTextNode(text + "\n"));
  });
}
function conImg(b64) {
  conStick(o => {
    const img = new Image(); img.alt = "matplotlib figure"; img.src = "data:image/png;base64," + b64;
    img.onload = () => { if (o.scrollHeight - o.scrollTop - o.clientHeight < img.height + 60) o.scrollTop = o.scrollHeight; };
    o.appendChild(img);
  });
}

/* ---- run / stop ---- */
function pgRun() {
  if (PG.running) return;
  const code = pgGet();
  conClear(); PG.running = true; pgButtons();
  $("#pg-time").textContent = "running…";
  if (PG.state !== "ready") {
    conLine("Starting Python. The first run downloads the runtime (about 10 MB) and any libraries you import, so give it a few seconds.", "s");
    PG.queued = code;
    pgBoot();
    return;
  }
  pgStatus("running", "Running…");
  PG.worker.postMessage({ code });
}
function pgStop() {
  if (!PG.worker || !PG.running) return;
  PG.worker.terminate(); PG.worker = null; PG.running = false; PG.queued = null; pgButtons();
  conLine("■ Stopped. Restarting Python…", "s");
  $("#pg-time").textContent = "stopped";

}

  $("#pg-copy").onclick = async e => {
    const b = e.currentTarget;
    try { await navigator.clipboard.writeText(pgGet()); b.textContent = "Copied ✓"; } catch (err) { b.textContent = "Copy failed"; }
    setTimeout(() => { b.textContent = "Copy"; }, 1500);
  };
  $("#pg-dl").onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([pgGet()], { type: "text/x-python" }));
    a.download = PG.cur.replace(/-/g, "_") + ".py"; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  $("#pg-select").onchange = e => { location.hash = "#play/" + e.target.value; };
  document.querySelectorAll(".pg-list [data-ex]").forEach(b => { b.onclick = () => { location.hash = "#play/" + b.dataset.ex; }; });
  const ta = $("#pg-code");
  ta.addEventListener("input", pgEdited);
  ta.addEventListener("keydown", e => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); pgRun(); }
    else if (e.key === "Tab") { e.preventDefault(); ta.setRangeText("    ", ta.selectionStart, ta.selectionEnd, "end"); pgEdited(); }
  });
  try {
    EXAMPLES.forEach(ex => { const s = localStorage.getItem("atlas-py-" + ex.id); if (s !== null && s !== ex.code) pgMarkEdited(ex.id, true); });
  } catch (e) {}
}

/* =========================================================================
   BOOT
   ========================================================================= */
renderPlay();
renderHome();
TRACKS.forEach(renderTrack);
const setHdr = () => root.style.setProperty("--hdr", document.querySelector("header").offsetHeight + "px");
setHdr(); window.addEventListener("resize", setHdr);
route();
</script>
</body>
</html>
