<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neural Atlas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='7' cy='9' r='4' fill='%230d8f7d'/%3E%3Ccircle cx='7' cy='23' r='4' fill='%230d8f7d'/%3E%3Ccircle cx='16' cy='16' r='4.5' fill='%236a4fe0'/%3E%3Ccircle cx='25' cy='16' r='4' fill='%23b86a06'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================== TOKENS ============================== */
:root {
  --bg: #f6f5f1; --surface: #ffffff; --surface-2: #f0eee8; --ink: #16161a; --muted: #5f606b;
  --line: rgba(22,22,30,.10); --line-2: rgba(22,22,30,.18); --code-bg: #f3f1ea;
  --ml: #0d8f7d; --dl: #6a4fe0; --rl: #b86a06; --py: #c0267a; --good: #1f7a4d; --bad: #c0392b;
  --wall: #3a3a44; --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px -12px rgba(0,0,0,.12);
  --acc: var(--dl); --hdr: 64px;
  --f-head: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
  --f-body: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #090a0e; --surface: #12131a; --surface-2: #1a1b24; --ink: #ecedf3; --muted: #9597a8;
    --line: rgba(255,255,255,.08); --line-2: rgba(255,255,255,.16); --code-bg: #0d0e14;
    --ml: #2dd4bf; --dl: #a594ff; --rl: #fbbf24; --py: #f472b6; --good: #5fd39a; --bad: #ff8a78;
    --wall: #454859; --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 12px 30px -16px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #090a0e; --surface: #12131a; --surface-2: #1a1b24; --ink: #ecedf3; --muted: #9597a8;
  --line: rgba(255,255,255,.08); --line-2: rgba(255,255,255,.16); --code-bg: #0d0e14;
  --ml: #2dd4bf; --dl: #a594ff; --rl: #fbbf24; --py: #f472b6; --good: #5fd39a; --bad: #ff8a78;
  --wall: #454859; --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 12px 30px -16px rgba(0,0,0,.7);
  color-scheme: dark;
}
[data-track="ml"] { --acc: var(--ml); }
[data-track="dl"] { --acc: var(--dl); }
[data-track="rl"] { --acc: var(--rl); }
[data-track="play"] { --acc: var(--py); }

/* ============================== BASE ============================== */
* { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.65 var(--f-body); overflow-x: hidden;
}
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(40vw 40vw at 5% -10%, color-mix(in srgb, var(--ml) 12%, transparent), transparent 70%),
    radial-gradient(40vw 40vw at 50% -20%, color-mix(in srgb, var(--dl) 12%, transparent), transparent 70%),
    radial-gradient(40vw 40vw at 100% -10%, color-mix(in srgb, var(--rl) 10%, transparent), transparent 70%);
}
h1, h2, h3, h4 { font-family: var(--f-head); letter-spacing: -.02em; line-height: 1.15; }
a { color: var(--acc); text-decoration: none; }
code, pre, .mono { font-family: var(--f-mono); }
code, pre, .mono, .console, .pg-editor, .CodeMirror, .formula { font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
button {
  font: 500 13px/1 var(--f-body); cursor: pointer; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line-2); border-radius: 999px;
  padding: 9px 14px; transition: border-color .15s, background .15s, transform .15s;
}
button:hover { border-color: var(--acc); }
button:active { transform: scale(.97); }
button.primary { background: var(--acc); border-color: var(--acc); color: var(--bg); }
button.primary:hover { filter: brightness(1.08); }
button.on { background: color-mix(in srgb, var(--acc) 18%, var(--surface)); border-color: var(--acc); color: var(--acc); }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }

/* ============================== HEADER ============================== */
header {
  position: sticky; top: 0; z-index: 50;
  background: color-mix(in srgb, var(--bg) 78%, transparent);
  backdrop-filter: saturate(160%) blur(14px); -webkit-backdrop-filter: saturate(160%) blur(14px);
  border-bottom: 1px solid var(--line);
}
.hdr {
  max-width: 1320px; margin: 0 auto; padding: 12px 20px;
  display: flex; align-items: center; gap: 16px;
}
.brand { display: flex; align-items: center; gap: 10px; color: var(--ink); font: 700 17px var(--f-head); white-space: nowrap; }
.brand svg { width: 28px; height: 28px; }
.tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 999px; border: 1px solid var(--line); }
.tabs a {
  padding: 6px 14px; border-radius: 999px; color: var(--muted); font: 500 13.5px var(--f-body);
  white-space: nowrap; transition: color .15s, background .15s;
}
.tabs a:hover { color: var(--ink); }
.tabs a.active { background: var(--surface); color: var(--acc); box-shadow: var(--shadow); }
.tabs a .s { display: none; }
.search-wrap { flex: 1; position: relative; min-width: 160px; }
.search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; color: var(--muted); }
#search {
  width: 100%; padding: 9px 40px 9px 36px; border-radius: 999px; font: 14px var(--f-body);
  border: 1px solid var(--line-2); background: var(--surface); color: var(--ink);
}
#search:focus { outline: none; border-color: var(--acc); box-shadow: 0 0 0 4px color-mix(in srgb, var(--acc) 18%, transparent); }
.kbd {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  font: 11px var(--f-mono); color: var(--muted); border: 1px solid var(--line-2); border-radius: 5px; padding: 1px 6px;
}
.icon-btn { padding: 8px; width: 36px; height: 36px; display: grid; place-items: center; }
.icon-btn svg { width: 16px; height: 16px; }

/* ============================== VIEWS ============================== */
.view { display: none; }
.view.active { display: block; animation: fade .35s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.wrap { max-width: 1320px; margin: 0 auto; padding: 0 20px; }

/* ---------- HOME ---------- */
.hero { position: relative; overflow: hidden; border-bottom: 1px solid var(--line); }
#hero-cv { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .9; }
.hero::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(90deg, var(--bg) 0%, color-mix(in srgb, var(--bg) 85%, transparent) 42%, transparent 75%);
}
.hero-inner { position: relative; z-index: 1; max-width: 1320px; margin: 0 auto; padding: 96px 20px 88px; }
.eyebrow {
  display: inline-flex; align-items: center; gap: 8px; font: 500 12px var(--f-mono);
  text-transform: uppercase; letter-spacing: .12em; color: var(--muted);
}
.eyebrow .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--acc); box-shadow: 0 0 12px var(--acc); }
.hero h1 { font-size: clamp(38px, 6.4vw, 76px); margin: 18px 0 18px; max-width: 12ch; font-weight: 700; }
.grad {
  background: linear-gradient(100deg, var(--ml), var(--dl) 50%, var(--rl));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.hero p.sub { font-size: 18px; color: var(--muted); max-width: 540px; margin: 0 0 30px; }
.hero .cta { display: flex; gap: 10px; flex-wrap: wrap; }
.hero .cta button { padding: 12px 20px; font-size: 14px; }
.stats-row { display: flex; gap: 36px; margin-top: 48px; flex-wrap: wrap; }
.stat b { display: block; font: 700 30px var(--f-head); }
.stat span { font-size: 13px; color: var(--muted); }

.block { padding: 72px 0 0; }
.block-head { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 26px; flex-wrap: wrap; }
.block-head h2 { font-size: clamp(26px, 3.4vw, 36px); margin: 8px 0 0; }
.block-head p { color: var(--muted); max-width: 520px; margin: 0; }

.tracks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.track-card {
  position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 26px;
  color: var(--ink); box-shadow: var(--shadow); transition: transform .25s, border-color .25s, box-shadow .25s;
}
.track-card::before {
  content: ""; position: absolute; width: 260px; height: 260px; right: -90px; top: -110px; border-radius: 50%;
  background: radial-gradient(circle, color-mix(in srgb, var(--acc) 30%, transparent), transparent 70%);
  transition: transform .4s;
}
.track-card:hover { transform: translateY(-4px); border-color: color-mix(in srgb, var(--acc) 55%, transparent);
  box-shadow: 0 20px 50px -24px color-mix(in srgb, var(--acc) 60%, transparent); }
.track-card:hover::before { transform: scale(1.25); }
.t-icon {
  width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; color: var(--acc);
  background: color-mix(in srgb, var(--acc) 14%, transparent); border: 1px solid color-mix(in srgb, var(--acc) 30%, transparent);
}
.t-icon svg { width: 26px; height: 26px; }
.track-card h3 { font-size: 24px; margin: 6px 0 0; }
.track-card .tl { color: var(--acc); font: 500 13px var(--f-mono); }
.track-card p { color: var(--muted); margin: 0; }
.track-card ul { list-style: none; padding: 0; margin: 4px 0 0; display: flex; flex-wrap: wrap; gap: 6px; }
.track-card li { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.track-card .go { margin-top: auto; padding-top: 10px; display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.track-card .go b { color: var(--acc); font-weight: 600; }

.fit { display: grid; grid-template-columns: 1.1fr 1fr; gap: 28px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 28px; box-shadow: var(--shadow); }
.fit svg { width: 100%; height: auto; }
.fit svg a { cursor: pointer; }
.fit svg a:hover ellipse, .fit svg a:hover circle { stroke-width: 2.5; }
.fit h3 { font-size: 22px; margin: 0 0 10px; }
.fit p { color: var(--muted); margin: 0 0 12px; }
.fit dl { margin: 0; display: grid; gap: 10px; }
.fit dt { font: 600 14px var(--f-head); }
.fit dd { margin: 0; color: var(--muted); font-size: 14px; }

.path { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0; counter-reset: p; position: relative; }
.path a {
  position: relative; padding: 46px 14px 0 0; color: var(--ink); counter-increment: p;
}
.path a::before {
  content: counter(p, decimal-leading-zero); position: absolute; top: 0; left: 0;
  width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 600 12px var(--f-mono);
  background: var(--surface); border: 1.5px solid var(--acc); color: var(--acc); z-index: 1;
}
.path a::after { content: ""; position: absolute; top: 17px; left: 34px; right: 0; height: 1.5px;
  background: linear-gradient(90deg, var(--acc), var(--line-2)); }
.path a:last-child::after { display: none; }
.path b { display: block; font: 600 15px var(--f-head); }
.path span { font-size: 13px; color: var(--muted); }
.path a:hover b { color: var(--acc); }

footer { margin-top: 90px; border-top: 1px solid var(--line); padding: 28px 20px 40px; text-align: center; color: var(--muted); font-size: 13px; }

/* ---------- TRACK PAGE ---------- */
.t-hero { position: relative; padding: 56px 0 36px; }
.t-hero h1 { font-size: clamp(34px, 5vw, 58px); margin: 14px 0 12px; }
.t-hero h1 .g { background: linear-gradient(100deg, var(--acc), var(--ink) 130%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.t-hero p { color: var(--muted); font-size: 17px; max-width: 640px; margin: 0; }
.t-meta { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
.pill { font: 500 12.5px var(--f-mono); padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--muted); background: var(--surface); }
.pill b { color: var(--acc); font-weight: 600; }

.roadmap { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 18px; scrollbar-width: thin; }
.roadmap a {
  flex: none; display: flex; align-items: center; gap: 8px; padding: 7px 14px 7px 7px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line); color: var(--ink); font-size: 13px; white-space: nowrap;
  transition: border-color .15s;
}
.roadmap a:hover { border-color: var(--acc); }
.roadmap a i { font: 600 11px var(--f-mono); font-style: normal; width: 24px; height: 24px; border-radius: 50%;
  display: grid; place-items: center; background: color-mix(in srgb, var(--acc) 16%, transparent); color: var(--acc); }

.t-layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 36px; }
.t-layout > * { min-width: 0; }
.side { position: sticky; top: calc(var(--hdr) + 20px); align-self: start; max-height: calc(100vh - var(--hdr) - 40px); overflow-y: auto; padding-bottom: 20px; }
.side .lbl { font: 500 11px var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px 10px; }
.side a {
  display: flex; justify-content: space-between; gap: 8px; padding: 6px 10px; border-radius: 8px;
  color: var(--muted); font-size: 13.5px; align-items: baseline; border-left: 2px solid transparent; transition: all .15s;
}
.side a:hover { color: var(--ink); background: var(--surface-2); }
.side a.cur { color: var(--acc); border-left-color: var(--acc); background: color-mix(in srgb, var(--acc) 8%, transparent); }
.side a small { font: 11px var(--f-mono); opacity: .7; }

.sec { scroll-margin-top: calc(var(--hdr) + 16px); padding-top: 12px; margin-bottom: 44px; }
.sec-h { display: flex; align-items: baseline; gap: 14px; margin-bottom: 4px; }
.sec-h .n { font: 600 13px var(--f-mono); color: var(--acc); }
.sec-h h2 { font-size: 26px; margin: 0; }
.sec > p.lead { color: var(--muted); margin: 0 0 18px; max-width: 720px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.card {
  position: relative; text-align: left; display: flex; flex-direction: column; gap: 8px; width: 100%;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px;
  font: inherit; color: var(--ink); line-height: 1.55; box-shadow: var(--shadow);
  transition: transform .2s, border-color .2s, box-shadow .2s;
}
.card:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--acc) 55%, transparent);
  box-shadow: 0 16px 40px -22px color-mix(in srgb, var(--acc) 70%, transparent); }
.card h3 { font-size: 16.5px; margin: 0; font-weight: 600; padding-right: 18px; }
.card p { margin: 0; color: var(--muted); font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 3; line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card .foot { margin-top: auto; padding-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { font: 500 11px var(--f-mono); padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.chip.acc { background: color-mix(in srgb, var(--acc) 14%, transparent); color: var(--acc); }
.card .arrow { position: absolute; right: 16px; top: 16px; color: var(--muted); opacity: 0; transition: all .2s; }
.card:hover .arrow { opacity: 1; color: var(--acc); transform: translate(2px, -2px); }

.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 11px 16px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
th { font: 500 11px var(--f-mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); background: var(--surface-2); }
td:first-child { font-weight: 600; }
td.hl { color: var(--acc); font-weight: 600; }

.gloss { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
.gloss div { padding: 14px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.gloss b { font-family: var(--f-head); display: block; margin-bottom: 2px; }
.gloss span { color: var(--muted); font-size: 13.5px; }

/* ---------- LABS ---------- */
.lab {
  position: relative; border-radius: 22px; padding: 1px;
  background: linear-gradient(135deg, color-mix(in srgb, var(--acc) 60%, transparent), var(--line) 40%, var(--line) 60%, color-mix(in srgb, var(--acc) 40%, transparent));
}
.lab-in { border-radius: 21px; background: var(--surface); padding: 24px; }
.lab-head { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.lab-head h3 { font-size: 22px; margin: 8px 0 6px; }
.lab-head p { color: var(--muted); margin: 0; max-width: 680px; font-size: 14px; }
.lab-body { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 20px; }
.lab-cv { width: 100%; display: block; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); touch-action: manipulation; }
#km-cv { aspect-ratio: 16 / 10; cursor: crosshair; }
#act-cv { aspect-ratio: 16 / 9; cursor: crosshair; }
#gw-cv { aspect-ratio: 4 / 3; cursor: pointer; }
.ctrl { display: flex; flex-direction: column; gap: 14px; font-size: 13px; }
.ctrl label { display: grid; gap: 6px; color: var(--muted); }
.ctrl label b { color: var(--ink); font-family: var(--f-mono); font-weight: 500; }
.ctrl .row { display: flex; justify-content: space-between; }
input[type=range] { width: 100%; accent-color: var(--acc); }
.btns { display: flex; flex-wrap: wrap; gap: 6px; }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.kv div { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; }
.kv span { display: block; font-size: 11px; color: var(--muted); font-family: var(--f-mono); text-transform: uppercase; letter-spacing: .06em; }
.kv b { font: 600 16px var(--f-head); }
.formula {
  font: 13px/1.6 var(--f-mono); background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 12px; margin: 0; white-space: pre; overflow-x: auto; color: var(--ink);
}
.legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 10px; font: 12px var(--f-mono); color: var(--muted); min-height: 18px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
#gw-spark { width: 100%; height: 56px; display: block; border-radius: 10px; background: var(--surface-2); }
.hint { font-size: 12.5px; color: var(--muted); margin: 0; }

/* ---------- MODAL ---------- */
dialog {
  width: min(780px, calc(100vw - 24px)); max-height: calc(100vh - 48px); padding: 0; border: 0; border-radius: 22px;
  background: var(--surface); color: var(--ink); box-shadow: 0 40px 120px -20px rgba(0,0,0,.5);
  overflow: hidden;
}
dialog::backdrop { background: rgba(5,6,10,.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
dialog[open] { animation: pop .25s cubic-bezier(.2,.9,.3,1.2); }
@keyframes pop { from { opacity: 0; transform: translateY(12px) scale(.98); } to { opacity: 1; transform: none; } }
.m { max-height: calc(100vh - 48px); overflow-y: auto; padding: 0 30px 26px; border-top: 3px solid var(--acc); }
.m-top { position: sticky; top: 0; background: var(--surface); display: flex; justify-content: space-between; align-items: center; padding: 18px 0 10px; z-index: 1; }
.crumb { font: 500 12px var(--f-mono); color: var(--muted); display: flex; gap: 8px; align-items: center; }
.badge { padding: 2px 8px; border-radius: 6px; background: var(--acc); color: var(--bg); font: 600 12px var(--f-mono); }
.m h2 { font-size: 30px; margin: 6px 0 10px; }
.m .tags { display: flex; gap: 6px; flex-wrap: wrap; }
.m .desc { font-size: 15.5px; margin: 14px 0 0; }
.m-lbl { font: 500 11px var(--f-mono); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 22px 0 8px; display: flex; justify-content: space-between; align-items: center; }
.m-lbl button { padding: 4px 10px; font-size: 11px; }
.pc { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pc > div { border-radius: 12px; padding: 12px 14px; background: var(--surface-2); }
.pc b { font: 600 13px var(--f-head); }
.pc .g b { color: var(--good); } .pc .r b { color: var(--bad); }
.pc ul { margin: 6px 0 0; padding-left: 18px; font-size: 13.5px; color: var(--muted); }

<script type="text/x-python" id="ex-ml-linreg" data-track="ml" data-title="Linear regression: closed form vs gradient descent"
  data-desc="Fit a line two ways, watch the loss fall, and see what a too-large learning rate does."
  data-topics="Linear Regression|Gradient &amp; Chain Rule|Supervised Learning">
# Linear regression two ways: the closed-form normal equation vs gradient descent.
# Try LR = 0.35 to watch gradient descent diverge, or LR = 0.01 to see it crawl.
import numpy as np
import matplotlib.pyplot as plt

rng = np.random.default_rng(0)
X = rng.uniform(-3, 3, size=(100, 1))
y = 4.0 + 2.5 * X[:, 0] + rng.normal(0, 1.0, size=100)   # true b = 4, w = 2.5

# 1) Closed form: theta = (XᵀX)⁻¹ Xᵀy, with a column of ones for the bias
Xb = np.c_[np.ones(len(X)), X]
theta_closed = np.linalg.solve(Xb.T @ Xb, Xb.T @ y)
print("Closed form:      b = %.3f, w = %.3f" % tuple(theta_closed))

# 2) Batch gradient descent on the mean squared error
LR, EPOCHS = 0.1, 200
theta = np.zeros(2)
losses = []
for epoch in range(EPOCHS):
    err = Xb @ theta - y
    losses.append((err ** 2).mean())
    grad = 2 * Xb.T @ err / len(y)
    theta -= LR * grad

print("Gradient descent: b = %.3f, w = %.3f" % tuple(theta))
print("Final MSE: %.4f" % losses[-1])

fig, ax = plt.subplots(1, 2, figsize=(10, 4))
xs = np.linspace(-3, 3, 50)
ax[0].scatter(X, y, s=14, alpha=0.6, label="data")
ax[0].plot(xs, theta[0] + theta[1] * xs, "r", lw=2, label="gradient descent fit")
ax[0].set_title("Data and fitted line"); ax[0].legend()
ax[1].plot(losses)
ax[1].set_yscale("log"); ax[1].set_xlabel("epoch"); ax[1].set_title("MSE per epoch")
plt.tight_layout()
plt.show()
</script>

<script type="text/x-python" id="ex-ml-classifiers" data-track="ml" data-title="Six classifiers, one dataset"
  data-desc="Logistic regression, k-NN, SVM, tree, random forest and naive Bayes: cross-validated accuracy and decision boundaries."
  data-topics="Logistic Regression|k-Nearest Neighbours|Support Vector Machine|Naive Bayes|Multi-class Strategies">
# Six classic classifiers on the same non-linear dataset.
# Compare 5-fold cross-validated accuracy and the shape of each decision boundary.
# Try changing noise=, or the model settings (k, C, gamma, max_depth).
import numpy as np
import matplotlib.pyplot as plt
from sklearn.datasets import make_moons
from sklearn.model_selection import cross_val_score
from sklearn.pipeline import make_pipeline
from sklearn.preprocessing import StandardScaler
from sklearn.linear_model import LogisticRegression
from sklearn.neighbors import KNeighborsClassifier
from sklearn.svm import SVC
from sklearn.tree import DecisionTreeClassifier
from sklearn.ensemble import RandomForestClassifier
from sklearn.naive_bayes import GaussianNB

X, y = make_moons(n_samples=300, noise=0.25, random_state=0)

models = {
    "Logistic Regression": LogisticRegression(),
    "k-NN (k=7)": KNeighborsClassifier(n_neighbors=7),
    "SVM (RBF kernel)": SVC(kernel="rbf", C=1.0, gamma=2.0),
    "Decision Tree (depth 5)": DecisionTreeClassifier(max_depth=5, random_state=0),
    "Random Forest": RandomForestClassifier(n_estimators=100, random_state=0),
    "Gaussian Naive Bayes": GaussianNB(),
}

xx, yy = np.meshgrid(np.linspace(-2, 3, 150), np.linspace(-1.5, 2, 150))
grid = np.c_[xx.ravel(), yy.ravel()]

fig, axes = plt.subplots(2, 3, figsize=(12, 7))
for ax, (name, model) in zip(axes.ravel(), models.items()):
    pipe = make_pipeline(StandardScaler(), model)
    scores = cross_val_score(pipe, X, y, cv=5)
    pipe.fit(X, y)
    Z = pipe.predict(grid).reshape(xx.shape)
    ax.contourf(xx, yy, Z, alpha=0.25, cmap="coolwarm")
    ax.scatter(X[:, 0], X[:, 1], c=y, cmap="coolwarm", s=12, edgecolor="k", linewidth=0.3)
    ax.set_title(f"{name}\nCV accuracy = {scores.mean():.3f}", fontsize=10)
    ax.set_xticks([]); ax.set_yticks([])
    print(f"{name:25s} {scores.mean():.3f} ± {scores.std():.3f}")

plt.tight_layout()
plt.show()
</script>

<script type="text/x-python" id="ex-ml-bias-variance" data-track="ml" data-title="Underfitting vs overfitting"
  data-desc="Polynomial regression of increasing degree, with train and test error side by side."
  data-topics="Bias–Variance Tradeoff|Overfitting vs Underfitting|Polynomial Regression">
# Underfitting vs overfitting with polynomial regression.
# A low degree is too simple (high bias); a high degree memorises noise (high variance).
# Try N_TRAIN = 200: more data makes high-degree models behave much better.
import numpy as np
import matplotlib.pyplot as plt
from sklearn.pipeline import make_pipeline
from sklearn.preprocessing import PolynomialFeatures
from sklearn.linear_model import LinearRegression
from sklearn.metrics import mean_squared_error

N_TRAIN, NOISE = 30, 0.25
rng = np.random.default_rng(0)
f = lambda x: np.sin(2 * np.pi * x)
x_tr = rng.uniform(0, 1, N_TRAIN); y_tr = f(x_tr) + rng.normal(0, NOISE, N_TRAIN)
x_te = rng.uniform(0, 1, 300);     y_te = f(x_te) + rng.normal(0, NOISE, 300)

def fit(degree):
    return make_pipeline(PolynomialFeatures(degree), LinearRegression()).fit(x_tr[:, None], y_tr)

degrees = list(range(1, 16))
tr_err, te_err = [], []
for d in degrees:
    m = fit(d)
    tr_err.append(mean_squared_error(y_tr, m.predict(x_tr[:, None])))
    te_err.append(mean_squared_error(y_te, m.predict(x_te[:, None])))
    print(f"degree {d:2d}   train MSE {tr_err[-1]:.3f}   test MSE {te_err[-1]:.3f}")

best = degrees[int(np.argmin(te_err))]
print("\nBest degree by test error:", best)

xs = np.linspace(0, 1, 300)
fig, axes = plt.subplots(1, 4, figsize=(15, 3.6))
for ax, d, label in zip(axes, [1, best, 15], ["underfit", "just right", "overfit"]):
    ax.scatter(x_tr, y_tr, s=14, label="train")
    ax.plot(xs, f(xs), "k--", lw=1, label="truth")
    ax.plot(xs, fit(d).predict(xs[:, None]), "r", lw=2, label=f"degree {d}")
    ax.set_ylim(-2, 2); ax.set_title(f"Degree {d} ({label})"); ax.legend(fontsize=7)
axes[3].plot(degrees, tr_err, "o-", label="train")
axes[3].plot(degrees, te_err, "o-", label="test")
axes[3].set_yscale("log"); axes[3].set_xlabel("degree"); axes[3].set_title("Error vs complexity"); axes[3].legend()
plt.tight_layout()
plt.show()
</script>

<script type="text/x-python" id="ex-ml-regularization" data-track="ml" data-title="Ridge vs Lasso paths"
  data-desc="Watch L2 shrink every weight and L1 zero out the useless ones as α grows."
  data-topics="Ridge (L2)|Lasso (L1)|Elastic Net|Norms|Feature Selection">
# Ridge (L2) vs Lasso (L1): how coefficients shrink as regularisation strength grows.
# Only 4 of the 10 features really matter. Lasso sets the others to exactly zero.
import numpy as np
import matplotlib.pyplot as plt
from sklearn.linear_model import Ridge, Lasso, LinearRegression
from sklearn.preprocessing import StandardScaler

rng = np.random.default_rng(1)
n, d = 80, 10
X = StandardScaler().fit_transform(rng.normal(size=(n, d)))
true_w = np.array([3, -2, 0, 0, 1.5, 0, 0, 0, 0.5, 0])
y = X @ true_w + rng.normal(0, 1, n)

ridge_alphas = np.logspace(-2, 4, 60)
lasso_alphas = np.logspace(-3, 1, 60)
ridge_path = np.array([Ridge(alpha=a).fit(X, y).coef_ for a in ridge_alphas])
lasso_path = np.array([Lasso(alpha=a, max_iter=20000).fit(X, y).coef_ for a in lasso_alphas])

np.set_printoptions(precision=2, suppress=True)
print("true weights :", true_w.astype(float))
print("OLS          :", LinearRegression().fit(X, y).coef_)
print("Ridge α=10   :", Ridge(alpha=10).fit(X, y).coef_)
print("Lasso α=0.2  :", Lasso(alpha=0.2).fit(X, y).coef_)

fig, ax = plt.subplots(1, 2, figsize=(12, 4))
ax[0].plot(ridge_alphas, ridge_path); ax[0].set_xscale("log")
ax[0].set_title("Ridge: weights shrink smoothly"); ax[0].set_xlabel("alpha")

import numpy as np
import matplotlib.pyplot as plt
from sklearn.datasets import load_breast_cancer
from sklearn.model_selection import train_test_split
from sklearn.pipeline import make_pipeline
from sklearn.preprocessing import StandardScaler
from sklearn.linear_model import LogisticRegression

                             precision_recall_curve, average_precision_score, precision_score, recall_score)

                                          random_state=1, stratify=data.target)

<script type="text/x-python" id="ex-dl-mlp-xor" data-track="dl" data-title="Neural net from scratch: XOR"
  data-desc="A 2-4-1 network with hand-written forward and backward passes."
  data-topics="Perceptron &amp; Neuron|Multi-Layer Perceptron|Forward &amp; Backpropagation|Tensors &amp; Autograd">
# A neural network from scratch: 2 → 4 → 1 MLP with hand-written backprop, learning XOR.
# XOR is not linearly separable, so a single neuron can't learn it but one hidden layer can.
import numpy as np
import matplotlib.pyplot as plt

X = np.array([[0, 0], [0, 1], [1, 0], [1, 1]], dtype=float)
y = np.array([[0], [1], [1], [0]], dtype=float)

HIDDEN, LR, EPOCHS, SEED = 4, 1.0, 3000, 42
rng = np.random.default_rng(SEED)
W1 = rng.normal(0, 1, (2, HIDDEN)); b1 = np.zeros(HIDDEN)
W2 = rng.normal(0, 1, (HIDDEN, 1)); b2 = np.zeros(1)
sigmoid = lambda z: 1 / (1 + np.exp(-z))

losses = []
for epoch in range(EPOCHS):
    # forward pass
    a1 = np.tanh(X @ W1 + b1)
    p = sigmoid(a1 @ W2 + b2)
    loss = -np.mean(y * np.log(p + 1e-9) + (1 - y) * np.log(1 - p + 1e-9))
    losses.append(loss)

    # backward pass (sigmoid + binary cross-entropy gives dL/dz2 = p - y)
    dz2 = (p - y) / len(X)
    dW2, db2 = a1.T @ dz2, dz2.sum(0)
    dz1 = (dz2 @ W2.T) * (1 - a1 ** 2)          # tanh'(z) = 1 - tanh²(z)
    dW1, db1 = X.T @ dz1, dz1.sum(0)

    # gradient descent step
    W1 -= LR * dW1; b1 -= LR * db1
    W2 -= LR * dW2; b2 -= LR * db2

    if epoch % 500 == 0:
        print(f"epoch {epoch:4d}  loss {loss:.4f}")

print("\nPredictions:")
for xi, pi in zip(X, p):
    print(f"  {xi.astype(int)} → {pi[0]:.3f}")

xx, yy = np.meshgrid(np.linspace(-0.5, 1.5, 200), np.linspace(-0.5, 1.5, 200))
grid = np.c_[xx.ravel(), yy.ravel()]
Z = sigmoid(np.tanh(grid @ W1 + b1) @ W2 + b2).reshape(xx.shape)

fig, ax = plt.subplots(1, 2, figsize=(11, 4))
ax[0].plot(losses); ax[0].set_yscale("log"); ax[0].set_title("Training loss"); ax[0].set_xlabel("epoch")
cs = ax[1].contourf(xx, yy, Z, levels=20, cmap="coolwarm", alpha=0.8)
ax[1].scatter(X[:, 0], X[:, 1], c=y[:, 0], cmap="coolwarm", s=150, edgecolor="k")
ax[1].set_title("Learned decision surface for XOR"); fig.colorbar(cs, ax=ax[1])
plt.tight_layout()
plt.show()
</script>

<script type="text/x-python" id="ex-dl-mlp-moons" data-track="dl" data-title="Numpy MLP with mini-batch SGD"
  data-desc="A configurable network: swap activations, layer sizes and learning rates and watch the decision boundary change."
  data-topics="The Training Loop|Weight Initialisation|Binary Cross-Entropy">
# A reusable numpy MLP trained with mini-batch SGD.
# Change ACTIVATION ("relu", "tanh", "sigmoid"), HIDDEN, LR or EPOCHS and compare.
import numpy as np
import matplotlib.pyplot as plt
from sklearn.datasets import make_moons

ACTIVATION, HIDDEN, LR, EPOCHS, BATCH = "relu", [32, 32], 0.1, 300, 32

X, y = make_moons(n_samples=600, noise=0.2, random_state=0)
y = y.reshape(-1, 1).astype(float)
rng = np.random.default_rng(0)
idx = rng.permutation(len(X)); tr, te = idx[:450], idx[450:]

acts = {
    "relu":    (lambda z: np.maximum(0, z), lambda a, z: (z > 0).astype(float)),
    "tanh":    (np.tanh,                    lambda a, z: 1 - a ** 2),
    "sigmoid": (lambda z: 1 / (1 + np.exp(-z)), lambda a, z: a * (1 - a)),
}
act, dact = acts[ACTIVATION]
sigmoid = acts["sigmoid"][0]

# He initialisation suits ReLU; Xavier suits tanh and sigmoid
sizes = [2] + HIDDEN + [1]
scale = (lambda n: np.sqrt(2 / n)) if ACTIVATION == "relu" else (lambda n: np.sqrt(1 / n))
Ws = [rng.normal(0, scale(m), (m, n)) for m, n in zip(sizes[:-1], sizes[1:])]
bs = [np.zeros(n) for n in sizes[1:]]

def forward(x):
    zs, as_ = [], [x]
    for i, (W, b) in enumerate(zip(Ws, bs)):
        z = as_[-1] @ W + b
        zs.append(z)
        as_.append(sigmoid(z) if i == len(Ws) - 1 else act(z))
    return zs, as_

losses, accs = [], []
for epoch in range(EPOCHS):
    perm = rng.permutation(tr)
    for start in range(0, len(perm), BATCH):
        b_idx = perm[start:start + BATCH]
        zs, as_ = forward(X[b_idx])
        delta = (as_[-1] - y[b_idx]) / len(b_idx)          # BCE + sigmoid
        for i in reversed(range(len(Ws))):
            gW, gb = as_[i].T @ delta, delta.sum(0)
            if i > 0:
                delta = (delta @ Ws[i].T) * dact(as_[i], zs[i - 1])
            Ws[i] -= LR * gW; bs[i] -= LR * gb
    p = forward(X[tr])[1][-1]
    losses.append(-np.mean(y[tr] * np.log(p + 1e-9) + (1 - y[tr]) * np.log(1 - p + 1e-9)))
    accs.append(((forward(X[te])[1][-1] > 0.5) == y[te]).mean())
    if epoch % 50 == 0 or epoch == EPOCHS - 1:
        print(f"epoch {epoch:3d}  train loss {losses[-1]:.4f}  test acc {accs[-1]:.3f}")

xx, yy = np.meshgrid(np.linspace(-2, 3, 200), np.linspace(-1.5, 2, 200))
Z = forward(np.c_[xx.ravel(), yy.ravel()])[1][-1].reshape(xx.shape)
fig, ax = plt.subplots(1, 2, figsize=(12, 4))
ax[0].plot(losses, label="train loss"); ax[0].plot(accs, label="test accuracy")
ax[0].set_xlabel("epoch"); ax[0].legend(); ax[0].set_title(f"{ACTIVATION} network {HIDDEN}")
ax[1].contourf(xx, yy, Z, levels=20, cmap="coolwarm", alpha=0.7)
ax[1].scatter(X[:, 0], X[:, 1], c=y[:, 0], cmap="coolwarm", s=8, edgecolor="k", linewidth=0.2)
ax[1].set_title("Decision boundary")
plt.tight_layout()
plt.show()
</script>

<script type="text/x-python" id="ex-dl-optimizers" data-track="dl" data-title="SGD vs Momentum vs RMSProp vs Adam"
  data-desc="Four optimisers race down a curved valley toward the minimum."
  data-topics="Gradient Descent / SGD|Momentum &amp; Nesterov|RMSProp|Adam / AdamW|Learning-Rate Schedules">
# SGD vs Momentum vs RMSProp vs Adam on a curved valley (Rosenbrock-style).
# Each optimiser starts at the same point; watch how they reach the minimum at (1, 1).
import numpy as np
import matplotlib.pyplot as plt

def f(p):
    x, y = p
    return (1 - x) ** 2 + 5 * (y - x ** 2) ** 2

def grad(p):
    x, y = p
    return np.array([-2 * (1 - x) - 20 * x * (y - x ** 2), 10 * (y - x ** 2)])

START, STEPS = np.array([-1.5, 2.0]), 400

def sgd(lr=0.02):
    p = START.copy(); path = [p.copy()]
    for _ in range(STEPS):
        p -= lr * grad(p); path.append(p.copy())
    return np.array(path)

def momentum(lr=0.005, beta=0.9):
    p, v = START.copy(), np.zeros(2); path = [p.copy()]
    for _ in range(STEPS):
        v = beta * v + grad(p); p -= lr * v; path.append(p.copy())
    return np.array(path)

def rmsprop(lr=0.02, rho=0.9, eps=1e-8):
    p, s = START.copy(), np.zeros(2); path = [p.copy()]
    for _ in range(STEPS):
        g = grad(p); s = rho * s + (1 - rho) * g ** 2
        p -= lr * g / (np.sqrt(s) + eps); path.append(p.copy())
    return np.array(path)

def adam(lr=0.05, b1=0.9, b2=0.999, eps=1e-8):
    p, m, v = START.copy(), np.zeros(2), np.zeros(2); path = [p.copy()]
    for t in range(1, STEPS + 1):
        g = grad(p)
        m = b1 * m + (1 - b1) * g; v = b2 * v + (1 - b2) * g ** 2
        m_hat, v_hat = m / (1 - b1 ** t), v / (1 - b2 ** t)
        p -= lr * m_hat / (np.sqrt(v_hat) + eps); path.append(p.copy())
    return np.array(path)

runs = {"SGD": sgd(), "Momentum": momentum(), "RMSProp": rmsprop(), "Adam": adam()}
for name, path in runs.items():
    print(f"{name:9s} final point ({path[-1, 0]:+.3f}, {path[-1, 1]:+.3f})   loss {f(path[-1]):.5f}")

xx, yy = np.meshgrid(np.linspace(-2, 2, 300), np.linspace(-1, 3, 300))
zz = f((xx, yy))
fig, ax = plt.subplots(1, 2, figsize=(13, 5))
ax[0].contour(xx, yy, np.log(zz + 1e-3), levels=30, cmap="gray", alpha=0.6)
for name, path in runs.items():
    ax[0].plot(path[:, 0], path[:, 1], lw=1.8, label=name)
ax[0].plot(1, 1, "r*", ms=15); ax[0].plot(*START, "ko")
ax[0].set_title("Optimiser paths"); ax[0].legend()
for name, path in runs.items():
    ax[1].plot([f(p) for p in path], label=name)
ax[1].set_yscale("log"); ax[1].set_xlabel("step"); ax[1].set_title("Loss"); ax[1].legend()
plt.tight_layout()
plt.show()

  data-topics="Vanishing &amp; Exploding Gradients|Residual Connections|Gradient Clipping">
# Vanishing gradients: how big is the gradient at each layer of a 30-layer network?
# Sigmoid shrinks it layer after layer. ReLU with He init and residual connections keep it alive.
import numpy as np
import matplotlib.pyplot as plt

DEPTH, WIDTH, BATCH = 30, 64, 128
rng = np.random.default_rng(0)
x0 = rng.normal(size=(BATCH, WIDTH))

def grad_norms(kind):
    sig = lambda z: 1 / (1 + np.exp(-z))
    std = np.sqrt(2 / WIDTH) if "relu" in kind else np.sqrt(1 / WIDTH)
    Ws = [rng.normal(0, std, (WIDTH, WIDTH)) for _ in range(DEPTH)]
    acts, x = [], x0
    for W in Ws:                                   # forward pass
        z = x @ W
        a = np.maximum(0, z) if "relu" in kind else sig(z)
        x = x + a if "residual" in kind else a
        acts.append((z, a))
    g, norms = np.ones_like(x), []
    for W, (z, a) in zip(reversed(Ws), reversed(acts)):   # backward pass
        local = (z > 0).astype(float) if "relu" in kind else a * (1 - a)
        g_branch = (g * local) @ W.T
        g = g + g_branch if "residual" in kind else g_branch
        norms.append(np.linalg.norm(g) / np.sqrt(g.size))
    return norms[::-1]                             # layer 1 first

kinds = ["sigmoid", "relu (He init)", "sigmoid + residual"]
plt.figure(figsize=(9, 4.5))
for k in kinds:
    n = grad_norms(k)
    plt.plot(range(1, DEPTH + 1), n, "o-", ms=3, label=k)
    print(f"{k:22s} gradient at layer 1: {n[0]:.2e}   at layer {DEPTH}: {n[-1]:.2e}")
plt.yscale("log"); plt.xlabel("layer (1 = closest to the input)"); plt.ylabel("gradient RMS")
plt.title("Gradient size per layer"); plt.legend(); plt.grid(alpha=0.3)
plt.show()

  data-topics="Softmax|Categorical Cross-Entropy|KL Divergence">
# Softmax + cross-entropy from scratch, a numerical-stability trick, and a gradient check.
import numpy as np
import matplotlib.pyplot as plt

def softmax_naive(z):
    e = np.exp(z)
    return e / e.sum()

def softmax(z):
    e = np.exp(z - z.max())            # subtracting the max changes nothing mathematically
    return e / e.sum()

big = np.array([1000.0, 1001.0, 1002.0])
with np.errstate(over="ignore", invalid="ignore"):
    print("naive softmax of large logits :", softmax_naive(big))
print("stable softmax of large logits:", softmax(big).round(4))

def cross_entropy(z, target):
    return -np.log(softmax(z)[target])

# The analytic gradient of CE w.r.t. the logits is simply p − onehot(target)
z = np.array([2.0, 1.0, 0.1, -1.0]); target = 0
p = softmax(z)
analytic = p.copy(); analytic[target] -= 1

numeric, h = np.zeros_like(z), 1e-5
for i in range(len(z)):
    zp, zm = z.copy(), z.copy(); zp[i] += h; zm[i] -= h
    numeric[i] = (cross_entropy(zp, target) - cross_entropy(zm, target)) / (2 * h)

np.set_printoptions(precision=6, suppress=True)
print("\nprobabilities   :", p)
print("loss            :", round(cross_entropy(z, target), 6))
print("analytic grad   :", analytic)
print("numerical grad  :", numeric)
print("max difference  :", np.abs(analytic - numeric).max())

temps = [0.5, 1, 2, 5]
plt.figure(figsize=(9, 4))
w = 0.2
for i, T in enumerate(temps):
    plt.bar(np.arange(len(z)) + i * w, softmax(z / T), width=w, label=f"T = {T}")
plt.xticks(np.arange(len(z)) + 0.3, [f"logit {v}" for v in z])
plt.title("Softmax with temperature: low T is sharper, high T is flatter"); plt.legend()
plt.show()

# 2D convolution from scratch: slide hand-made kernels over an image to detect edges.
# CNNs learn kernels like these automatically.
import numpy as np
import matplotlib.pyplot as plt

N = 64
yy, xx = np.mgrid[0:N, 0:N]
img = np.zeros((N, N))
img[12:30, 10:28] = 1.0                                   # a square
img[((xx - 44) ** 2 + (yy - 42) ** 2) < 13 ** 2] = 0.6    # a circle
img += np.random.default_rng(0).normal(0, 0.05, img.shape)

def conv2d(image, kernel, stride=1):
    kh, kw = kernel.shape
    H = (image.shape[0] - kh) // stride + 1
    W = (image.shape[1] - kw) // stride + 1
    out = np.zeros((H, W))
    for i in range(kh):                  # loop over kernel offsets, vectorised over the image
        for j in range(kw):
            out += kernel[i, j] * image[i:i + H * stride:stride, j:j + W * stride:stride]
    return out

def max_pool(x, size=2):
    H, W = x.shape[0] // size, x.shape[1] // size
    return x[:H * size, :W * size].reshape(H, size, W, size).max(axis=(1, 3))

kernels = {
    "vertical edges (Sobel x)":   np.array([[-1, 0, 1], [-2, 0, 2], [-1, 0, 1]]),
    "horizontal edges (Sobel y)": np.array([[-1, -2, -1], [0, 0, 0], [1, 2, 1]]),
    "blur (box 3×3)":             np.ones((3, 3)) / 9,
    "sharpen":                    np.array([[0, -1, 0], [-1, 5, -1], [0, -1, 0]]),
}

fig, axes = plt.subplots(1, 5, figsize=(16, 3.6))
axes[0].imshow(img, cmap="gray"); axes[0].set_title(f"input {img.shape}")
for ax, (name, k) in zip(axes[1:], kernels.items()):
    out = conv2d(img, k)
    ax.imshow(out, cmap="gray"); ax.set_title(f"{name}\n{out.shape}", fontsize=9)
    print(f"{name:28s} output {out.shape}  → after 2×2 max-pool {max_pool(out).shape}")
for ax in axes:
    ax.axis("off")
plt.tight_layout()
plt.show()
print("\nOutput size formula: (W − K + 2P) / S + 1 =", (64 - 3 + 0) // 1 + 1)

  data-topics="Attention|Transformer|Tokenisation &amp; Embeddings|Large Language Models">
# Scaled dot-product self-attention from scratch, the core operation inside a Transformer.
import numpy as np
import matplotlib.pyplot as plt

tokens = ["the", "cat", "sat", "on", "the", "mat"]
D_MODEL, D_HEAD, CAUSAL = 16, 8, False       # set CAUSAL = True for a GPT-style mask
rng = np.random.default_rng(3)

vocab = {w: rng.normal(size=D_MODEL) for w in set(tokens)}
X = np.stack([vocab[w] for w in tokens])      # (seq_len, d_model)
X += 0.1 * np.sin(np.arange(len(tokens))[:, None] / (10 ** (np.arange(D_MODEL) / D_MODEL)))  # positions

def attention_head(X, seed):
    r = np.random.default_rng(seed)
    Wq, Wk, Wv = (r.normal(0, 1 / np.sqrt(D_MODEL), (D_MODEL, D_HEAD)) for _ in range(3))
    Q, K, V = X @ Wq, X @ Wk, X @ Wv
    scores = Q @ K.T / np.sqrt(D_HEAD)
    if CAUSAL:
        scores = np.where(np.tril(np.ones_like(scores)) == 1, scores, -np.inf)
    weights = np.exp(scores - scores.max(1, keepdims=True))
    weights /= weights.sum(1, keepdims=True)                      # softmax per row
    return weights @ V, weights

heads = [attention_head(X, s) for s in (0, 1)]
out = np.concatenate([h[0] for h in heads], axis=1)              # multi-head: concatenate
print("input X        :", X.shape)
print("each head out  :", heads[0][0].shape)
print("multi-head out :", out.shape)
print("rows of each attention matrix sum to 1:", np.allclose(heads[0][1].sum(1), 1))

fig, axes = plt.subplots(1, 2, figsize=(11, 4.5))
for i, (ax, (_, w)) in enumerate(zip(axes, heads)):
    im = ax.imshow(w, cmap="viridis", vmin=0, vmax=1)
    ax.set_xticks(range(len(tokens)), tokens); ax.set_yticks(range(len(tokens)), tokens)
    ax.set_xlabel("attends to (keys)"); ax.set_ylabel("query token"); ax.set_title(f"Head {i + 1}")
    for r in range(len(tokens)):
        for c in range(len(tokens)):
            ax.text(c, r, f"{w[r, c]:.2f}", ha="center", va="center", fontsize=7,
                    color="w" if w[r, c] < 0.5 else "k")
fig.colorbar(im, ax=axes)
plt.show()

import numpy as np
import matplotlib.pyplot as plt
from sklearn.datasets import load_digits
from sklearn.model_selection import train_test_split
from sklearn.preprocessing import StandardScaler
from sklearn.neural_network import MLPClassifier
from sklearn.metrics import confusion_matrix

X, y = load_digits(return_X_y=True)

  data-desc="Greedy, ε-greedy, UCB and Thompson sampling on 500 random 10-armed bandits."
  data-topics="The Bandit Problem|ε-Greedy|Upper Confidence Bound (UCB)|Thompson Sampling|Exploration vs Exploitation|Contextual Bandits">
# The 10-armed bandit: greedy vs ε-greedy vs UCB vs Thompson sampling.
# Averaged over many random bandit problems, all simulated in parallel with numpy.
import numpy as np
import matplotlib.pyplot as plt

K, STEPS, RUNS, EPS, UCB_C = 10, 1000, 500, 0.1, 2.0

def simulate(select, seed=0):
    rng = np.random.default_rng(seed)
    mu = rng.normal(0, 1, (RUNS, K)); best = mu.argmax(1)
    Q, N = np.zeros((RUNS, K)), np.zeros((RUNS, K))
    rows = np.arange(RUNS)
    reward, optimal = np.zeros(STEPS), np.zeros(STEPS)
    for t in range(STEPS):
        a = select(Q, N, t, rng)
        r = rng.normal(mu[rows, a], 1)
        N[rows, a] += 1
        Q[rows, a] += (r - Q[rows, a]) / N[rows, a]        # incremental mean
        reward[t], optimal[t] = r.mean(), (a == best).mean()
    return reward, optimal

def argmax_ties(v, rng):
    return (v + 1e-9 * rng.random(v.shape)).argmax(1)

def greedy(Q, N, t, rng):
    return argmax_ties(Q, rng)

def eps_greedy(Q, N, t, rng):
    explore = rng.random(RUNS) < EPS
    return np.where(explore, rng.integers(0, K, RUNS), argmax_ties(Q, rng))

def ucb(Q, N, t, rng):
    bonus = UCB_C * np.sqrt(np.log(t + 1) / np.maximum(N, 1e-9))
    return argmax_ties(np.where(N == 0, np.inf, Q + bonus), rng)

def thompson(Q, N, t, rng):
    # Gaussian posterior with a N(0, 1) prior and unit-variance rewards
    mean, std = Q * N / (N + 1), 1 / np.sqrt(N + 1)
    return (mean + std * rng.normal(size=Q.shape)).argmax(1)

strategies = {"greedy": greedy, f"ε-greedy (ε={EPS})": eps_greedy, f"UCB (c={UCB_C})": ucb, "Thompson": thompson}
fig, ax = plt.subplots(1, 2, figsize=(13, 4.5))
smooth = lambda v: np.convolve(v, np.ones(20) / 20, mode="valid")
for name, fn in strategies.items():
    rew, opt = simulate(fn)
    ax[0].plot(smooth(rew), label=name); ax[1].plot(smooth(opt) * 100, label=name)
    print(f"{name:20s} avg reward (last 200 steps) {rew[-200:].mean():.3f}   optimal arm {opt[-200:].mean():.1%}")
ax[0].set_title("Average reward"); ax[1].set_title("% of runs picking the best arm")
for a in ax:
    a.set_xlabel("step"); a.legend(); a.grid(alpha=0.3)
plt.tight_layout()
plt.show()
</script>

  data-desc="Solve the classic 4×3 world exactly, then change the step reward and noise."
  data-topics="Value Iteration|Policy Iteration|Policy Evaluation|Bellman Equations|Generalised Policy Iteration|Markov Decision Process|Return &amp; Discount Factor">
# Value iteration on the classic 4×3 gridworld with slippery moves.
# Try STEP_REWARD = -2.0 (the agent rushes, even into the pit) or +0.1 (it never leaves),
# or NOISE = 0 for deterministic moves.
import numpy as np
import matplotlib.pyplot as plt

GAMMA, NOISE, STEP_REWARD = 0.99, 0.2, -0.04
ROWS, COLS = 3, 4
WALLS = {(1, 1)}
TERMINAL = {(0, 3): +1.0, (1, 3): -1.0}
ACTIONS = {"↑": (-1, 0), "→": (0, 1), "↓": (1, 0), "←": (0, -1)}
PERP = {"↑": "←→", "↓": "←→", "←": "↑↓", "→": "↑↓"}
states = [(r, c) for r in range(ROWS) for c in range(COLS) if (r, c) not in WALLS]

def move(s, a):
    r, c = s[0] + ACTIONS[a][0], s[1] + ACTIONS[a][1]
    return (r, c) if 0 <= r < ROWS and 0 <= c < COLS and (r, c) not in WALLS else s

def transitions(s, a):
    # intended move with prob 1 − NOISE, each perpendicular move with NOISE / 2
    return [(1 - NOISE, move(s, a))] + [(NOISE / 2, move(s, p)) for p in PERP[a]]

V = {s: 0.0 for s in states}
deltas = []
for it in range(1000):
    new_V, delta = {}, 0.0
    for s in states:
        if s in TERMINAL:
            new_V[s] = TERMINAL[s]; continue
        new_V[s] = max(sum(p * (STEP_REWARD + GAMMA * V[s2]) for p, s2 in transitions(s, a)) for a in ACTIONS)
        delta = max(delta, abs(new_V[s] - V[s]))
    V = new_V; deltas.append(delta)
    if delta < 1e-6:
        break
print(f"converged after {it + 1} iterations\n")

policy = {s: max(ACTIONS, key=lambda a: sum(p * V[s2] for p, s2 in transitions(s, a)))
          for s in states if s not in TERMINAL}
for r in range(ROWS):
    vals = "  ".join("  ####" if (r, c) in WALLS else f"{V[(r, c)]:+.3f}" for c in range(COLS))
    arrows = "  ".join("■" if (r, c) in WALLS else ("+1" if TERMINAL.get((r, c)) == 1 else "-1")
                       if (r, c) in TERMINAL else policy[(r, c)] for c in range(COLS))
    print(f"{vals}     {arrows}")

grid = np.full((ROWS, COLS), np.nan)
for s, v in V.items():
    grid[s] = v
fig, ax = plt.subplots(1, 2, figsize=(11, 3.8))
im = ax[0].imshow(grid, cmap="RdYlGn", vmin=-1, vmax=1)
for (r, c), v in V.items():
    label = f"{v:+.2f}" + ("" if (r, c) in TERMINAL else f"\n{policy[(r, c)]}")
    ax[0].text(c, r, label, ha="center", va="center", fontsize=11)
ax[0].set_xticks([]); ax[0].set_yticks([]); ax[0].set_title("V*(s) and greedy policy")
fig.colorbar(im, ax=ax[0])
ax[1].plot(deltas); ax[1].set_yscale("log"); ax[1].set_xlabel("iteration"); ax[1].set_title("max |ΔV| per sweep")
plt.tight_layout()
plt.show()
</script>

# Tabular Q-learning on a gridworld with traps: the same world as the interactive lab.
# S = start, G = goal (+10), T = trap (−10), # = wall, each step costs −0.1.
import numpy as np
import matplotlib.pyplot as plt

MAP = ["....T..G",
       ".##..#..",
       "...#.#.T",
       ".T.#....",
       "..##.T#.",
       "S......."]
ALPHA, GAMMA, EPSILON, EPISODES = 0.3, 0.95, 0.15, 1500
H, W = len(MAP), len(MAP[0])
MOVES = [(-1, 0), (0, 1), (1, 0), (0, -1)]
ARROWS = "↑→↓←"
start = next((r, c) for r in range(H) for c in range(W) if MAP[r][c] == "S")

def step(s, a):
    r, c = s[0] + MOVES[a][0], s[1] + MOVES[a][1]
    if not (0 <= r < H and 0 <= c < W) or MAP[r][c] == "#":
        r, c = s
    cell = MAP[r][c]
    if cell == "G": return (r, c), 10.0, True
    if cell == "T": return (r, c), -10.0, True
    return (r, c), -0.1, False

rng = np.random.default_rng(0)
Q = np.zeros((H, W, 4))
returns = []
for ep in range(EPISODES):
    s, G = start, 0.0
    for t in range(200):
        a = rng.integers(4) if rng.random() < EPSILON else int(np.argmax(Q[s] + 1e-9 * rng.random(4)))
        s2, r, done = step(s, a)
        target = r + (0 if done else GAMMA * Q[s2].max())
        Q[s][a] += ALPHA * (target - Q[s][a])       # the Q-learning update
        s, G = s2, G + r
        if done:
            break
    returns.append(G)
    if (ep + 1) % 300 == 0:
        print(f"episode {ep + 1:5d}  avg return (last 100) {np.mean(returns[-100:]):6.2f}")

print("\nGreedy policy:")
for r in range(H):
    print("  " + " ".join(MAP[r][c] if MAP[r][c] in "#TG" else ARROWS[Q[r, c].argmax()] for c in range(W)))

s, path = start, [start]
for _ in range(50):
    s, _, done = step(s, int(Q[s].argmax())); path.append(s)
    if done: break
print(f"\nGreedy path reaches {MAP[s[0]][s[1]]} in {len(path) - 1} steps")

fig, ax = plt.subplots(1, 2, figsize=(13, 4.2))
ax[0].plot(np.convolve(returns, np.ones(50) / 50, mode="valid"))
ax[0].set_xlabel("episode"); ax[0].set_title("Return per episode (50-episode moving average)")
from matplotlib.colors import TwoSlopeNorm
V = Q.max(axis=2); V[[[ch in "#GT" for ch in row] for row in MAP]] = np.nan
ax[1].imshow(V, cmap="RdYlGn", norm=TwoSlopeNorm(vcenter=0, vmin=min(-1, np.nanmin(V)), vmax=max(1, np.nanmax(V)))); ax[1].set_title("max_a Q(s, a) and the greedy path")

for r in range(H):

<script type="text/x-python" id="ex-rl-cliff" data-track="rl" data-title="Cliff walking: SARSA vs Q-learning"
  data-desc="On-policy vs off-policy control on the classic cliff, with the safe and the risky path."
  data-topics="SARSA|Expected SARSA|RL Taxonomy">
# Cliff walking: SARSA (on-policy) vs Q-learning (off-policy), from Sutton & Barto.
# Q-learning learns the optimal path along the cliff edge but falls off while exploring.
# SARSA learns a safer path because it accounts for its own ε-greedy exploration.
import numpy as np
import matplotlib.pyplot as plt

H, W = 4, 12
START, GOAL = (3, 0), (3, 11)
ALPHA, GAMMA, EPSILON, EPISODES, RUNS = 0.5, 1.0, 0.1, 400, 8
MOVES = [(-1, 0), (0, 1), (1, 0), (0, -1)]

def step(s, a):
    r = min(max(s[0] + MOVES[a][0], 0), H - 1)
    c = min(max(s[1] + MOVES[a][1], 0), W - 1)
    if r == 3 and 0 < c < 11:          # fell off the cliff
        return START, -100.0
    return (r, c), -1.0

def policy(Q, s, rng):
    if rng.random() < EPSILON:
        return int(rng.integers(4))
    return int(np.argmax(Q[s] + 1e-9 * rng.random(4)))

def train(method, seed):
    rng = np.random.default_rng(seed)
    Q = np.zeros((H, W, 4)); totals = []
    for _ in range(EPISODES):
        s, a, total = START, policy(Q, START, rng), 0.0
        while s != GOAL:
            s2, r = step(s, a)
            a2 = policy(Q, s2, rng)
            nxt = Q[s2][a2] if method == "SARSA" else Q[s2].max()
            Q[s][a] += ALPHA * (r + GAMMA * nxt * (s2 != GOAL) - Q[s][a])
            s, a, total = s2, a2, total + r
        totals.append(total)
    return Q, np.array(totals)

def greedy_path(Q):
    grid = [["." for _ in range(W)] for _ in range(H)]
    for c in range(1, 11): grid[3][c] = "C"
    s = START
    for _ in range(60):
        grid[s[0]][s[1]] = "*"
        if s == GOAL: break
        s, _ = step(s, int(Q[s].argmax()))
    return "\n".join("  " + " ".join(row) for row in grid)

fig = plt.figure(figsize=(9, 4.5))
for method in ("SARSA", "Q-learning"):
    runs = [train(method, seed) for seed in range(RUNS)]
    curve = np.mean([t for _, t in runs], axis=0)
    plt.plot(np.convolve(curve, np.ones(10) / 10, mode="valid"), label=method)
    print(f"{method}: average reward per episode (last 100) = {curve[-100:].mean():.1f}")
    print(f"greedy path (* = path, C = cliff):\n{greedy_path(runs[0][0])}\n")
plt.ylim(-120, 0); plt.xlabel("episode"); plt.ylabel("sum of rewards per episode")
plt.title("Cliff walking with ε-greedy exploration"); plt.legend(); plt.grid(alpha=0.3)
plt.show()
</script>

<script type="text/x-python" id="ex-rl-mc-td" data-track="rl" data-title="Monte Carlo vs TD(0)"
  data-desc="Predict values on the 5-state random walk and compare how fast each method learns."
  data-topics="Monte Carlo Methods|Temporal-Difference TD(0)|Monte Carlo vs TD|n-step TD &amp; TD(λ)">
# Monte Carlo vs TD(0) prediction on the 5-state random walk (Sutton & Barto, Example 6.2).
# True values of states A..E are 1/6, 2/6, ..., 5/6. Which method gets there faster?
import numpy as np
import matplotlib.pyplot as plt

N_STATES, EPISODES, RUNS = 5, 100, 50
TRUE_V = np.arange(1, 6) / 6

def episode(rng):
    s, states, reward = 2, [2], 0            # start in the middle state (C)
    while True:
        s += rng.choice([-1, 1])
        if s < 0:  break
        if s >= N_STATES:
            reward = 1; break
        states.append(s)
    return states, reward

def run(method, alpha, seed):
    rng = np.random.default_rng(seed)
    V = np.full(N_STATES, 0.5); errors = []
    for _ in range(EPISODES):
        states, reward = episode(rng)
        if method == "TD":
            for i, s in enumerate(states):
                v_next = V[states[i + 1]] if i + 1 < len(states) else 0.0
                r = reward if i + 1 == len(states) else 0.0
                V[s] += alpha * (r + v_next - V[s])          # bootstrap from V(s')
        else:
            for s in states:
                V[s] += alpha * (reward - V[s])              # wait for the full return G
        errors.append(np.sqrt(np.mean((V - TRUE_V) ** 2)))
    return np.array(errors), V

plt.figure(figsize=(9, 4.5))
for method, alphas in (("TD", [0.05, 0.1, 0.15]), ("MC", [0.01, 0.02, 0.04])):
    for a in alphas:
        errs = np.mean([run(method, a, seed)[0] for seed in range(RUNS)], axis=0)
        plt.plot(errs, ls="-" if method == "TD" else "--", label=f"{method} α={a}")
        print(f"{method} α={a:<5} RMS error after {EPISODES} episodes: {errs[-1]:.4f}")

_, V = run("TD", 0.05, 0)
print("\nTD estimate:", V.round(3), "\ntrue values:", TRUE_V.round(3))
plt.xlabel("episodes"); plt.ylabel("RMS error (averaged over runs)")
plt.title("TD(0) (solid) vs Monte Carlo (dashed)"); plt.legend(ncol=2); plt.grid(alpha=0.3)
plt.show()
</script>

<script type="text/x-python" id="ex-rl-reinforce" data-track="rl" data-title="REINFORCE policy gradient"
  data-desc="Learn a stochastic policy on the short corridor, where no deterministic policy works."
  data-topics="REINFORCE|Policy Gradient Theorem|Baselines &amp; GAE|Actor-Critic, A2C &amp; A3C|Partial Observability (POMDP)">
# REINFORCE (Monte Carlo policy gradient) on the "short corridor" (Sutton & Barto, Example 13.1).
# In state 1 the actions are reversed, and every state looks identical to the agent.
# No deterministic policy can solve it, but a stochastic one can. The best is p(right) ≈ 0.59.
import numpy as np
import matplotlib.pyplot as plt

ALPHA, EPISODES, RUNS, USE_BASELINE = 2e-3, 1000, 20, True

def env_step(s, go_right):
    if s == 1:
        go_right = not go_right                   # the reversed state
    s = max(0, s + (1 if go_right else -1))
    return s, -1.0, s == 3

def value_of(p):
    # solve the Bellman equations exactly for a fixed p(right)
    A = np.array([[1 - (1 - p), -p, 0], [-p, 1, -(1 - p)], [0, -(1 - p), 1]])
    return np.linalg.solve(A, -np.ones(3))[0]

sigmoid = lambda x: 1 / (1 + np.exp(-x))

def train(seed):
    rng = np.random.default_rng(seed)
    theta, baseline, history = -1.5, 0.0, []      # start mostly going left
    for ep in range(EPISODES):
        s, steps = 0, []
        while True:
            p = sigmoid(theta)
            right = rng.random() < p
            steps.append((right, p))
            s, r, done = env_step(s, right)
            if done or len(steps) > 1000:
                break
        G = -np.arange(len(steps), 0, -1, dtype=float)   # return from each step = −(steps left)
        for (right, p), g in zip(steps, G):
            adv = g - baseline if USE_BASELINE else g
            grad_log_pi = (1 - p) if right else -p        # d/dθ log π(a)
            theta += ALPHA * adv * grad_log_pi
        baseline += 0.05 * (G[0] - baseline)
        history.append((sigmoid(theta), -len(steps)))
    return np.array(history)

hist = np.mean([train(s) for s in range(RUNS)], axis=0)
ps = np.linspace(0.05, 0.95, 181)
vals = [value_of(p) for p in ps]
best = ps[int(np.argmax(vals))]
print(f"optimal p(right) = {best:.3f}, value = {max(vals):.2f}")
print(f"REINFORCE learned p(right) = {hist[-1, 0]:.3f} after {EPISODES} episodes (mean of {RUNS} runs)")

fig, ax = plt.subplots(1, 2, figsize=(12, 4))
ax[0].plot(ps, vals); ax[0].axvline(best, ls="--", color="gray")
ax[0].set_xlabel("p(right)"); ax[0].set_ylabel("value of start state"); ax[0].set_title("Exact value of each stochastic policy")
ax[1].plot(np.convolve(hist[:, 1], np.ones(20) / 20, mode="valid"), label="return (smoothed)")
ax[1].axhline(max(vals), ls="--", color="gray", label="optimal")
ax2 = ax[1].twinx(); ax2.plot(hist[:, 0], color="#f59e0b", label="p(right)"); ax2.set_ylim(0, 1)
ax[1].set_xlabel("episode"); ax[1].set_title("REINFORCE learning curve"); ax[1].legend(loc="lower right")
plt.tight_layout()
plt.show()
</script>

      code: `from sklearn.naive_bayes import MultinomialNB
MultinomialNB().fit(X_counts, y)` },
    { t: "Support Vector Machine", tags: ["kernel", "max-margin"],
      d: "Finds the hyperplane with the widest margin between classes. C controls how soft the margin is, and the kernel trick (RBF, polynomial) gives non-linear boundaries.",
      f: "min ½‖w‖² + C Σ ξᵢ   s.t. yᵢ(wᵀxᵢ + b) ≥ 1 − ξᵢ\nRBF: K(x,x') = exp(−γ‖x − x'‖²)",
      pros: ["Effective in high dimensions", "Robust margin"], cons: ["Slow on large n", "Needs scaling and tuning"],
      code: `from sklearn.svm import SVC
SVC(kernel="rbf", C=1.0, gamma="scale", probability=True)` },
    { t: "Decision Tree", tags: ["tree"],
      d: "Recursively splits on features to maximise purity, measured by Gini impurity or entropy. Trees are interpretable but overfit easily, so limit their depth.",
      f: "Gini = 1 − Σ pₖ²\nEntropy = −Σ pₖ log₂ pₖ\nIG = H(parent) − Σ (nᵢ/n) H(childᵢ)",
      pros: ["Interpretable", "No scaling needed"], cons: ["High variance", "Axis-aligned splits only"],
      code: `from sklearn.tree import DecisionTreeClassifier, plot_tree
t = DecisionTreeClassifier(max_depth=4).fit(X_tr, y_tr)
plot_tree(t, feature_names=cols, filled=True)` },
    { t: "Multi-class Strategies", tags: ["concept"],
      d: "One-vs-Rest trains K binary models and One-vs-One trains K(K−1)/2. Softmax handles multiple classes natively. Multi-label problems use an independent sigmoid per label." },
    { t: "Threshold & Calibration", tags: ["concept"],
      d: "A threshold of 0.5 is rarely optimal, so tune it on validation data. Calibrate probabilities with Platt scaling or isotonic regression.",
      code: `from sklearn.calibration import CalibratedClassifierCV
CalibratedClassifierCV(base_clf, method="isotonic", cv=5)` }
  ]},
  { id: "ensembles", name: "Ensembles & Trees", lead: "Many weak models combined into a strong one. Usually the best choice for tabular data.", items: [
    { t: "Bagging", tags: ["variance ↓"],
      d: "Bootstrap aggregating trains models on resampled data and averages them, which reduces variance. Out-of-bag samples give you a free validation estimate." },
    { t: "Random Forest", tags: ["bagging"],
      d: "Bagged decision trees that also consider a random subset of features at each split, which decorrelates the trees. It needs little tuning.",
      pros: ["Strong default", "OOB score and feature importances"], cons: ["Large models", "Less interpretable"],
      code: `from sklearn.ensemble import RandomForestClassifier
rf = RandomForestClassifier(n_estimators=300, max_features="sqrt",
                            oob_score=True, n_jobs=-1).fit(X_tr, y_tr)` },
    { t: "AdaBoost", tags: ["boosting"],
      d: "Trains weak learners one after another, re-weighting the samples that were misclassified. The final model is a weighted vote.",
      f: "F(x) = Σ αₘ hₘ(x)" },
    { t: "Gradient Boosting", tags: ["boosting"],
      d: "Each new tree fits the negative gradient (the residuals) of the loss of the current ensemble. A learning rate shrinks each step.",
      f: "Fₘ(x) = Fₘ₋₁(x) + η · hₘ(x),   hₘ ≈ −∂L/∂F" },
    { t: "XGBoost / LightGBM / CatBoost", tags: ["boosting", "SOTA tabular"],
      d: "Optimised gradient-boosting libraries. XGBoost uses a regularised objective, LightGBM uses histograms and leaf-wise growth for speed, and CatBoost handles categorical features natively.",
      code: `import lightgbm as lgb
m = lgb.LGBMClassifier(n_estimators=1000, learning_rate=0.05, num_leaves=31)
m.fit(X_tr, y_tr, eval_set=[(X_val, y_val)],
      callbacks=[lgb.early_stopping(50)])` },
    { t: "Stacking & Voting", tags: ["meta"],
      d: "Voting averages the models' predictions. Stacking trains a meta-model on the base models' out-of-fold predictions.",
      code: `from sklearn.ensemble import StackingClassifier
StackingClassifier(estimators=[("rf", rf), ("svm", svm)],
                   final_estimator=LogisticRegression())` }
  ]},
  { id: "unsupervised", name: "Unsupervised Learning", lead: "Clustering, dimensionality reduction and anomaly detection. Try k-means in the lab above.", items: [
    { t: "k-Means", tags: ["clustering"],
      d: "Alternates between assigning each point to its nearest centroid and moving each centroid to the mean of its points. Choose k with the elbow method or the silhouette score.",
      f: "J = Σₖ Σ_{x∈Cₖ} ‖x − μₖ‖²",
      pros: ["Fast and simple"], cons: ["Assumes round clusters", "Sensitive to initialisation"],
      code: `from sklearn.cluster import KMeans
km = KMeans(n_clusters=4, n_init=10).fit(X)
km.labels_, km.inertia_` },
    { t: "Hierarchical Clustering", tags: ["clustering"],
      d: "Merges clusters bottom-up (agglomerative). The linkage (single, complete, average or Ward) defines the distance between clusters, and you cut the dendrogram to get k clusters." },
    { t: "DBSCAN", tags: ["density"],
      d: "Groups densely packed points and marks sparse ones as noise. It finds clusters of any shape and doesn't need k.",
      code: `from sklearn.cluster import DBSCAN
DBSCAN(eps=0.5, min_samples=5).fit_predict(X)` },
    { t: "Gaussian Mixture Models", tags: ["probabilistic"],
      d: "Soft clustering that models the data as a mixture of Gaussians, fitted with Expectation–Maximisation. Each point gets a probability for every cluster.",
      f: "p(x) = Σₖ πₖ N(x; μₖ, Σₖ)" },
    { t: "PCA", tags: ["dim. reduction"],
      d: "Projects data onto the orthogonal directions of maximum variance, which are the eigenvectors of the covariance matrix. Scale the features first.",
      f: "Σ = (1/n) XᵀX,   Σv = λv\nexplained ratio = λᵢ / Σλ",
      code: `from sklearn.decomposition import PCA
pca = PCA(n_components=0.95).fit(X_scaled)` },
    { t: "t-SNE & UMAP", tags: ["visualisation"],
      d: "Non-linear embeddings that preserve local neighbourhoods, used for 2D plots. UMAP is faster and keeps more global structure. Distances between clusters in these plots aren't meaningful.",
      code: `from sklearn.manifold import TSNE
emb = TSNE(n_components=2, perplexity=30).fit_transform(X)` },
    { t: "Anomaly Detection", tags: ["outliers"],
      d: "Isolation Forest isolates outliers with random splits, since anomalies need fewer splits. Alternatives include One-Class SVM, LOF and autoencoder reconstruction error.",
      code: `from sklearn.ensemble import IsolationForest
IsolationForest(contamination=0.01).fit_predict(X)  # -1 = anomaly` },
    { t: "Association Rules", tags: ["market basket"],
      d: "Apriori and FP-Growth find items that occur together. Rules are scored by support, confidence and lift.",
      f: "lift(A→B) = P(A∩B) / (P(A) P(B))" }
  ]},
  { id: "evaluation", name: "Evaluation & Metrics", lead: "Measure what matters, and validate honestly.", items: [
    { t: "Confusion Matrix", tags: ["classification"],
      d: "A table of TP, FP, FN and TN. Almost every classification metric is computed from it.",
      f: "              Pred +   Pred −\nActual +       TP       FN\nActual −       FP       TN",
      code: `from sklearn.metrics import ConfusionMatrixDisplay
ConfusionMatrixDisplay.from_estimator(clf, X_te, y_te)` },
    { t: "Precision, Recall & F1", tags: ["classification"],
      d: "Precision is the share of predicted positives that are correct. Recall is the share of actual positives that were found. F1 is their harmonic mean. Accuracy is misleading when classes are imbalanced.",
      f: "Precision = TP / (TP+FP)\nRecall    = TP / (TP+FN)\nF1        = 2PR / (P+R)",
      code: `from sklearn.metrics import classification_report
print(classification_report(y_te, y_pred))` },
    { t: "ROC-AUC & PR-AUC", tags: ["classification"],
      d: "ROC-AUC is the probability that a random positive is ranked above a random negative. The precision-recall curve is more informative when classes are heavily imbalanced.",
      f: "TPR = TP/(TP+FN)   FPR = FP/(FP+TN)",
      code: `from sklearn.metrics import roc_auc_score, average_precision_score
roc_auc_score(y_te, proba); average_precision_score(y_te, proba)` },
    { t: "Log Loss", tags: ["probabilistic"],
      d: "Heavily penalises confident wrong predictions. It measures how good the probabilities are, not just their ranking.",
      f: "LogLoss = −(1/n) Σ [y log p + (1−y) log(1−p)]" },
    { t: "Regression Metrics", tags: ["regression"],
      d: "MAE is robust to outliers. MSE and RMSE penalise large errors more. R² is the share of variance explained. MAPE breaks down when y is close to 0.",
      f: "MAE  = (1/n) Σ|y − ŷ|\nRMSE = √((1/n) Σ(y − ŷ)²)\nR²   = 1 − SS_res / SS_tot" },
    { t: "Clustering Metrics", tags: ["unsupervised"],
      d: "Without labels, use silhouette (higher is better) or Davies–Bouldin (lower is better). With labels, use ARI or NMI.",
      f: "s = (b − a) / max(a, b)" },
    { t: "Cross-Validation", tags: ["validation"],
      d: "k-fold CV rotates the validation fold. Use Stratified k-fold for classification, GroupKFold when samples are related, TimeSeriesSplit for temporal data, and nested CV to tune and evaluate without bias.",
      code: `from sklearn.model_selection import cross_val_score, StratifiedKFold
cv = StratifiedKFold(n_splits=5, shuffle=True, random_state=0)
scores = cross_val_score(pipe, X, y, cv=cv, scoring="f1")` },
    { t: "Hyperparameter Tuning", tags: ["tuning"],
      d: "Grid search is exhaustive. Random search usually finds good settings faster. Bayesian optimisation (Optuna) models the objective, and Hyperband stops bad trials early.",
      code: `from sklearn.model_selection import RandomizedSearchCV
search = RandomizedSearchCV(pipe, params, n_iter=50, cv=5, scoring="roc_auc")
search.fit(X_tr, y_tr); search.best_params_` }
  ]},
  { id: "timeseries", name: "Time Series", lead: "Data where order matters.", items: [
    { t: "Components & Stationarity", tags: ["theory"],
      d: "A series is made of trend, seasonality and noise. Many models need stationarity: test it with ADF, and fix it with differencing or a log transform." },
    { t: "ARIMA / SARIMA", tags: ["classic"],
      d: "AutoRegressive (p), Integrated (d) and Moving Average (q) terms, with seasonal terms added in SARIMA. Choose p and q from ACF and PACF plots.",
      code: `from statsmodels.tsa.arima.model import ARIMA
m = ARIMA(series, order=(2, 1, 2)).fit()
m.forecast(steps=12)` },
    { t: "ML for Forecasting", tags: ["modern"],
      d: "Build lag, rolling-window and calendar features, then use gradient boosting. Prophet and N-BEATS are alternatives. Always validate with time-ordered splits." }
  ]},
  { id: "practice", name: "Interpretability & MLOps", lead: "Understanding models and keeping them healthy in production.", items: [
    { t: "Permutation Importance", tags: ["explain"],
      d: "Shuffle one feature and measure how much the score drops. It works for any model and is more reliable than tree impurity importances.",
      code: `from sklearn.inspection import permutation_importance
r = permutation_importance(model, X_te, y_te, n_repeats=10)` },
    { t: "SHAP", tags: ["explain"],
      d: "Shapley values from game theory give each feature's contribution to a single prediction, and the contributions add up to the prediction.",
      code: `import shap
explainer = shap.TreeExplainer(model)
shap.summary_plot(explainer.shap_values(X_te), X_te)` },
    { t: "Fairness & Bias", tags: ["ethics"],
      d: "Models reproduce the bias in their data. Measure demographic parity and equalised odds per group, and document your data and models with datasheets and model cards." },
    { t: "Saving & Serving", tags: ["deployment"],
      d: "Serialise with joblib, serve behind FastAPI, containerise with Docker, and scale with Kubernetes or serverless.",
      code: `import joblib
from fastapi import FastAPI
joblib.dump(pipe, "model.joblib")
app = FastAPI()
@app.post("/predict")
def predict(features: dict):
    return {"pred": float(pipe.predict(pd.DataFrame([features]))[0])}` },
    { t: "Experiment Tracking", tags: ["tooling"],
      d: "Log parameters, metrics, artefacts and data versions with MLflow, Weights & Biases or DVC, and set random seeds so runs can be reproduced." },
    { t: "Monitoring & Drift", tags: ["production"],
      d: "Data drift is a change in P(x); concept drift is a change in P(y|x). Monitor input and prediction distributions (PSI, KS test), and retrain when an alert fires." }
  ]},
  { id: "toolbox", name: "Toolbox", lead: "The Python libraries for classic ML.", items: [
    { t: "NumPy & Pandas", tags: ["data"],
      d: "NumPy provides n-dimensional arrays and vectorised maths. Pandas provides DataFrames for loading, cleaning, grouping and joining data." },
    { t: "Matplotlib & Seaborn", tags: ["viz"],
      d: "Matplotlib is the low-level plotting library. Seaborn builds statistical plots on top of it with good defaults.",
      code: `import seaborn as sns, matplotlib.pyplot as plt
sns.set_theme(style="whitegrid")
sns.histplot(df, x="age", hue="target", kde=True)
sns.boxplot(data=df, x="class", y="price")
plt.show()` },
    { t: "scikit-learn", tags: ["core"],
      d: "One consistent fit, predict and transform API, plus preprocessing, model selection, pipelines and metrics. It's the standard library for classic ML." },
    { t: "statsmodels, Optuna, SHAP", tags: ["utilities"],
